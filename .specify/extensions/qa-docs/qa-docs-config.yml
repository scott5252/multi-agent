# Project-local configuration for the post-implementation QA document gate.

guide_prefix: qa
reference_spec_dir: specs/008-production-audit-debugging
ui_reference_file: specs/013-admin-workflow-builder/qa013_ui.md

validation:
  min_guide_lines: 180
  min_env_lines: 35
  min_ui_lines: 160
  min_code_fences: 10
  min_expected_markers: 12
  min_ui_code_fences: 6
  min_ui_expected_markers: 8

