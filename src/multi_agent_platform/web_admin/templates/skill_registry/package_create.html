{% extends "admin_shell/base.html" %}

{% block content %}
<header class="workflow-header">
  <h1>{{ page.title }}</h1>
  <p>{{ page.redaction_notice }}</p>
</header>
{% include "skill_registry/components/form_errors.html" %}
<section>
  <h2>Package Identity</h2>
  <form method="post" action="/admin/skill-registry/ui/packages">
    <input type="hidden" name="idempotency_key" value="{{ page.values.idempotency_key if page.values else '' }}">
    <label>Slug <input name="slug" required value="{{ page.values.slug if page.values else 'calendar-assistant' }}"></label>
    <label>Display name <input name="display_name" required value="{{ page.values.display_name if page.values else 'Calendar Assistant' }}"></label>
    <label>Description <textarea name="description" rows="4">{{ page.values.description if page.values else 'Safe calendar skill.' }}</textarea></label>
    <label>Owner principal <input name="owner_principal_id" required value="{{ page.values.steward_principal_id if page.values else principal.principal_id }}"></label>
    <label>Lifecycle intent <input name="lifecycle_intent" value="{{ page.values.lifecycle_intent if page.values else 'publishable' }}"></label>
    <label>Safe docs summary <textarea name="safe_documentation_summary" rows="3">{{ page.values.safe_documentation_summary if page.values else '' }}</textarea></label>
    <button type="submit">Create Package</button>
  </form>
</section>
{% endblock %}
