{% extends "admin_shell/base.html" %}

{% block content %}
<header class="workflow-header">
  <h1>{{ page.title }}</h1>
  <p>{{ page.redaction_notice }}</p>
</header>
<section>
  <h2>Current Grants</h2>
  <p>{{ page.version.tenant_grants|join(", ") if page.version.tenant_grants else "No tenants granted yet." }}</p>
</section>
<section>
  <h2>Save Tenant Grants</h2>
  <form method="post" action="/admin/skill-registry/ui/packages/{{ page.version.slug }}/versions/{{ page.version.semantic_version }}/grants">
    <label>Tenant ids <textarea name="tenant_ids" rows="4">11111111-1111-1111-1111-111111111111</textarea></label>
    <label>Grant reason <input name="grant_reason" value="QA014 browser grant"></label>
    <button type="submit">Save Tenant Grants</button>
  </form>
</section>
{% endblock %}
