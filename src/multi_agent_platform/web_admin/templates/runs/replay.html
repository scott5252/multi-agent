<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Run Replay</title>
    <link rel="stylesheet" href="/admin/static/workflow_studio.css">
  </head>
  <body class="workflow-page" data-run-id="{{ workflow_run_id }}">
    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Production Audit</p>
          <h1>Replay</h1>
          <p class="subhead">Immutable run evidence in sequence.</p>
          <p class="mono">{{ workflow_run_id }}</p>
        </div>
      </header>
      <section class="registry-grid" aria-label="Replay">
        <article class="card registry-card">
          <h2>Events</h2>
          <ol data-audit-replay></ol>
        </article>
      </section>
    </main>
    <script src="/admin/static/run_inspection.js"></script>
  </body>
</html>
