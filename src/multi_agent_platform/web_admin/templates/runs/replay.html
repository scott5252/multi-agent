{% extends "admin_shell/base.html" %}

{% block body_attrs %} data-run-id="{{ workflow_run_id }}"{% endblock %}

{% block content %}
      <header class="hero">
        <div>
          <p class="eyebrow">Production Audit</p>
          <h1>Replay</h1>
          <p class="subhead">Immutable run evidence in sequence.</p>
          <p class="mono">{{ workflow_run_id }}</p>
        </div>
      </header>
      <section class="registry-grid" aria-label="Replay">
        <article class="card registry-card">
          <h2>Events</h2>
          <ol data-audit-replay></ol>
        </article>
      </section>
{% endblock %}

{% block page_scripts %}
  <script src="/admin/static/run_inspection.js"></script>
{% endblock %}
