{% extends "admin_shell/base.html" %}

{% block content %}
      <header class="workflow-header">
        <h1>{{ page.title }}</h1>
        <a href="/admin/model-providers">Back</a>
      </header>
      <form class="provider-form" method="post" action="{{ page.action }}" data-model-provider-form>
        <fieldset>
          <legend>Connection</legend>
          <label>Display name
            <input name="display_name" required value="{{ connection.display_name if connection else '' }}" />
          </label>
          <label>Provider type
            <select name="provider_type" required>
              {% for provider_type in page.provider_types %}
              <option value="{{ provider_type }}" {% if connection and connection.provider_type.value == provider_type %}selected{% endif %}>{{ provider_type }}</option>
              {% endfor %}
            </select>
          </label>
          <label>Base URL
            <input name="base_url" value="{{ connection.base_url_safe if connection and connection.base_url_safe else '' }}" />
          </label>
          <label>Secret references
            <textarea name="credential_secret_reference_ids" rows="2">{% if connection %}{{ connection.credential_secret_reference_ids|join(', ') }}{% endif %}</textarea>
          </label>
          <label class="checkbox-row"><input type="checkbox" name="active" value="true" {% if connection and connection.active %}checked{% endif %} /> Active</label>
        </fieldset>
        <fieldset>
          <legend>Models</legend>
          <textarea name="model_ids" rows="4" required data-model-rows>{% if models %}{% for model in models %}{{ model.model_id }}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}</textarea>
          <button type="button" data-add-model-row>Add model</button>
        </fieldset>
        <fieldset>
          <legend>Timeout policy</legend>
          <label>Connect seconds <input type="number" step="0.1" min="0.1" name="connect_seconds" value="{{ connection.timeout_policy.connect_seconds if connection and connection.timeout_policy.connect_seconds else 5.0 }}" /></label>
          <label>Read seconds <input type="number" step="0.1" min="0.1" name="read_seconds" value="{{ connection.timeout_policy.read_seconds if connection and connection.timeout_policy.read_seconds else 30.0 }}" /></label>
          <label>Total seconds <input type="number" step="0.1" min="0.1" name="total_seconds" value="{{ connection.timeout_policy.total_seconds if connection and connection.timeout_policy.total_seconds else 45.0 }}" /></label>
        </fieldset>
        <fieldset>
          <legend>Tenant visibility</legend>
          <label>Mode
            <select name="visibility_mode">
              {% for mode in page.visibility_modes %}
              <option value="{{ mode }}" {% if connection and connection.visibility_mode.value == mode %}selected{% endif %}>{{ mode }}</option>
              {% endfor %}
            </select>
          </label>
          <label>Tenant ids
            <textarea name="tenant_ids" rows="3"></textarea>
          </label>
        </fieldset>
        <button type="submit" {% if not page.can_mutate %}disabled{% endif %}>Save</button>
      </form>
{% endblock %}

{% block page_scripts %}
  <script src="/admin/static/model_providers.js"></script>
{% endblock %}
