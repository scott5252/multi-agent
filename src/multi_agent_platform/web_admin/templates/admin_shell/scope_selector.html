<section class="admin-scope" aria-labelledby="admin-scope-title">
  <div>
    <h2 id="admin-scope-title">Scope</h2>
    <p data-admin-scope-label>
      {% if shell.active_scope.scope_type == "tenant" %}
        Tenant: {{ shell.active_scope.label }}
      {% else %}
        Platform scope
      {% endif %}
    </p>
  </div>
  {% if shell.available_scopes|length > 1 %}
    <form method="get" action="/admin/scope" class="admin-scope-form">
      <label for="admin-scope-select">Switch scope</label>
      <input type="hidden" name="next" value="{{ request.url.path }}">
      <select id="admin-scope-select" name="tenant_id">
        {% for option in shell.available_scopes %}
          <option value="{{ option.scope.tenant_id or '' }}" {% if option.selected %}selected{% endif %}>
            {{ option.label }}
          </option>
        {% endfor %}
      </select>
      <button type="submit">Switch</button>
    </form>
  {% endif %}
</section>
