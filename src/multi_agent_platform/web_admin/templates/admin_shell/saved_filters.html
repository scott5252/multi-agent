<section class="admin-saved-filters" aria-labelledby="saved-filters-title">
  <h2 id="saved-filters-title">Saved Filters</h2>
  <ul>
    {% for saved_filter in shell.saved_filters %}
      <li>
        <span>{{ saved_filter.display_name }}</span>
        <span class="admin-filter-summary">
          {% for key, value in saved_filter.safe_summary.items() %}
            {{ key }}={{ value }}{% if not loop.last %}, {% endif %}
          {% endfor %}
        </span>
        <a href="{{ saved_filter.restore_href }}">Restore</a>
        <form method="post" action="{{ saved_filter.delete_href }}">
          <input type="hidden" name="return_to" value="{{ request.url.path }}">
          <button type="submit">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>
</section>
