{% extends "admin_shell/base.html" %}

{% block content %}
<section class="admin-section">
  <h2>{{ page.title }}</h2>
  <pre class="prompt-preview" aria-label="Safe rendered preview">{{ preview.rendered_preview }}</pre>
  <p>Redaction categories: {{ preview.redaction_categories | join(", ") if preview.redaction_categories else "None" }}</p>
  <a href="/admin/prompt-runtime/prompts/{{ page.prompt_lineage_id }}/edit">Back to Draft</a>
</section>
{% endblock %}
