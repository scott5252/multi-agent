{% extends "admin_shell/base.html" %}

{% block content %}
<section class="admin-section prompt-runtime-form">
  <h2>{{ page.title }}</h2>
  <form method="get" action="/admin/prompt-runtime/profiles/resolve">
    <label class="field-row"><span>Agent Key</span><input name="agent_key"></label>
    <label class="field-row"><span>Agent Kind</span><select name="agent_kind"><option value="agent">Agent</option><option value="sub_agent">Sub-agent</option></select></label>
    <button type="submit">Resolve</button>
  </form>
  <section class="validation-panel"><h3>Resolution</h3><p>Tenant profiles win before granted platform fallback profiles.</p></section>
</section>
{% endblock %}
