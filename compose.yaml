services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multi_agent_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2026-03-05T00-00-00Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  postgres-data:
  minio-data:
