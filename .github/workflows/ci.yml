name: ci

on:
  push:
    branches: ["main", "codex/**", "001-platform-foundation"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=src/multi_agent_platform --cov-report=term-missing --cov-fail-under=90
