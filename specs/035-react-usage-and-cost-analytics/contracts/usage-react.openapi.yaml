openapi: 3.1.0
info:
  title: React Usage And Cost Analytics API
  version: 0.1.0
  description: >
    Additive React admin contracts for safe usage analytics dashboards,
    drilldowns, and audited exports. Existing Spec 016 usage APIs remain
    available as Jinja/API fallbacks.
paths:
  /admin/app/usage/bootstrap.json:
    get:
      summary: Load the React usage analytics dashboard
      operationId: getReactUsageDashboard
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/GroupBy"
        - $ref: "#/components/parameters/ProviderKey"
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/UsageStatus"
      responses:
        "200":
          description: Dashboard payload for the active authorized scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactDashboard"
        "403":
          description: Safe denial for unauthorized platform or tenant scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactProblem"
  /admin/app/usage/events.json:
    get:
      summary: Load bounded event drilldown rows for active filters
      operationId: getReactUsageEvents
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/GroupBy"
        - $ref: "#/components/parameters/RollupKey"
        - $ref: "#/components/parameters/ProviderKey"
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/UsageStatus"
      responses:
        "200":
          description: Bounded safe event drilldown response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactEventDrilldown"
        "403":
          description: Safe denial for unauthorized drilldown scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactProblem"
  /admin/app/usage/exports:
    post:
      summary: Create an audited CSV export for the active safe filter snapshot
      operationId: createReactUsageExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageReactExportRequest"
      responses:
        "201":
          description: Export request accepted or completed with safe metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactExportSummary"
        "403":
          description: Safe denied export result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactExportSummary"
  /admin/app/usage/exports/{usage_export_request_id}.json:
    get:
      summary: Load safe export status and artifact metadata
      operationId: getReactUsageExport
      parameters:
        - name: usage_export_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Safe export detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactExportSummary"
        "404":
          description: Export missing or outside authorized scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReactProblem"
components:
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    Start:
      name: start
      in: query
      required: false
      schema:
        type: string
        format: date-time
    End:
      name: end
      in: query
      required: false
      schema:
        type: string
        format: date-time
    GroupBy:
      name: group_by
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UsageReactGroupBy"
    RollupKey:
      name: rollup_key
      in: query
      required: false
      schema:
        type: string
        maxLength: 255
    ProviderKey:
      name: provider_key
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    ModelId:
      name: model_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    UsageStatus:
      name: usage_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UsageReactConfidenceStatus"
  schemas:
    UsageReactGroupBy:
      type: string
      enum:
        - day
        - provider
        - model
        - workflow
        - agent
        - sub_agent
        - prompt
        - execution_mode
        - principal
        - graph_node
        - gateway_operation
        - physical_attempt
        - governed_tool
        - tenant
    UsageReactConfidenceStatus:
      type: string
      enum:
        - confirmed
        - estimated
        - partial
        - unavailable
    UsageReactExportStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
        - denied
    UsageReactDashboard:
      type: object
      required:
        - scope
        - filters
        - summary_cards
        - trend
        - rollup
        - drilldown
        - exports
        - states
        - updated_at
      properties:
        scope:
          $ref: "#/components/schemas/UsageReactScope"
        filters:
          $ref: "#/components/schemas/UsageReactFilterMetadata"
        summary_cards:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/UsageReactSummaryCard"
        trend:
          type: array
          maxItems: 31
          items:
            $ref: "#/components/schemas/UsageReactTrendPoint"
        rollup:
          $ref: "#/components/schemas/UsageReactRollupSection"
        drilldown:
          $ref: "#/components/schemas/UsageReactEventDrilldown"
        exports:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/UsageReactExportSummary"
        states:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactProblem"
        updated_at:
          type: string
          format: date-time
    UsageReactScope:
      type: object
      required: [scope_type, label, can_select_tenant, active_tenant_id]
      properties:
        scope_type:
          type: string
          enum: [platform, tenant]
        label:
          type: string
        active_tenant_id:
          type: [string, "null"]
          format: uuid
        can_select_tenant:
          type: boolean
    UsageReactFilterMetadata:
      type: object
      required:
        - selected_range
        - range_options
        - selected_group_by
        - group_by_options
        - confidence_options
        - availability_options
      properties:
        selected_range:
          $ref: "#/components/schemas/UsageReactRange"
        range_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        selected_group_by:
          $ref: "#/components/schemas/UsageReactGroupBy"
        group_by_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        tenant_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        provider_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        model_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        workflow_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        agent_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        prompt_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        confidence_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        availability_options:
          type: array
          items:
            $ref: "#/components/schemas/UsageReactFilterOption"
        disabled_reasons:
          type: object
          additionalProperties:
            type: string
    UsageReactRange:
      type: object
      required: [label, start, end]
      properties:
        label:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    UsageReactFilterOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
        disabled:
          type: boolean
          default: false
        disabled_reason:
          type: [string, "null"]
    UsageReactSummaryCard:
      type: object
      required: [card_id, label, value, unit, status, tone, detail]
      properties:
        card_id:
          type: string
        label:
          type: string
        value:
          type: string
        unit:
          type: string
        status:
          $ref: "#/components/schemas/UsageReactConfidenceStatus"
        tone:
          type: string
          enum: [neutral, success, warning, danger]
        comparison:
          type: [string, "null"]
        detail:
          type: string
        audit_reference:
          type: [string, "null"]
    UsageReactTrendPoint:
      type: object
      required:
        - bucket_start
        - bucket_end
        - label
        - confirmed_tokens
        - estimated_tokens
        - unavailable_events
        - estimated_cost_display
        - average_latency_ms
        - event_count
        - confidence_status
      properties:
        bucket_start:
          type: string
          format: date-time
        bucket_end:
          type: string
          format: date-time
        label:
          type: string
        confirmed_tokens:
          type: integer
          minimum: 0
        estimated_tokens:
          type: integer
          minimum: 0
        unavailable_events:
          type: integer
          minimum: 0
        estimated_cost_display:
          type: string
        estimated_cost_micros:
          type: integer
          minimum: 0
        currency:
          type: string
        average_latency_ms:
          type: integer
          minimum: 0
        event_count:
          type: integer
          minimum: 0
        confidence_status:
          $ref: "#/components/schemas/UsageReactConfidenceStatus"
    UsageReactRollupSection:
      type: object
      required: [group_by, rows, limit, total_rows]
      properties:
        group_by:
          $ref: "#/components/schemas/UsageReactGroupBy"
        rows:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/UsageReactRollupRow"
        limit:
          type: integer
          minimum: 1
          maximum: 25
        total_rows:
          type: integer
          minimum: 0
    UsageReactRollupRow:
      type: object
      required:
        - row_id
        - safe_label
        - event_count
        - total_tokens
        - estimated_cost_display
        - average_latency_ms
        - unavailable_event_count
        - confidence_status
      properties:
        row_id:
          type: string
        safe_label:
          type: string
        safe_summary:
          type: string
        event_count:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        estimated_cost_display:
          type: string
        estimated_cost_micros:
          type: integer
          minimum: 0
        currency:
          type: string
        average_latency_ms:
          type: integer
          minimum: 0
        unavailable_event_count:
          type: integer
          minimum: 0
        confidence_status:
          $ref: "#/components/schemas/UsageReactConfidenceStatus"
        attempt_summary:
          type: [string, "null"]
        tool_summary:
          type: [string, "null"]
        drilldown_href:
          type: string
    UsageReactEventDrilldown:
      type: object
      required: [rows, limit, total_rows, truncated]
      properties:
        rows:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/UsageReactEventRow"
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total_rows:
          type: integer
          minimum: 0
        truncated:
          type: boolean
    UsageReactEventRow:
      type: object
      required:
        - event_id
        - recorded_at
        - tenant_label
        - provider_label
        - model_label
        - total_tokens
        - estimated_cost_display
        - latency_ms
        - usage_status
      properties:
        event_id:
          type: string
          format: uuid
        recorded_at:
          type: string
          format: date-time
        tenant_label:
          type: string
        provider_label:
          type: string
        model_label:
          type: string
        workflow_label:
          type: [string, "null"]
        agent_label:
          type: [string, "null"]
        prompt_label:
          type: [string, "null"]
        graph_node_label:
          type: [string, "null"]
        gateway_operation_label:
          type: [string, "null"]
        physical_attempt_label:
          type: [string, "null"]
        tool_label:
          type: [string, "null"]
        total_tokens:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        estimated_cost_display:
          type: string
        latency_ms:
          type: integer
          minimum: 0
        usage_status:
          $ref: "#/components/schemas/UsageReactConfidenceStatus"
        cost_status:
          $ref: "#/components/schemas/UsageReactConfidenceStatus"
        safe_attribution_summary:
          type: string
        audit_reference:
          type: [string, "null"]
        trace_reference:
          type: [string, "null"]
    UsageReactExportRequest:
      type: object
      required: [filters]
      properties:
        filters:
          type: object
          additionalProperties:
            type: string
        requested_group_by:
          $ref: "#/components/schemas/UsageReactGroupBy"
        idempotency_key:
          type: [string, "null"]
          maxLength: 128
    UsageReactExportSummary:
      type: object
      required:
        - usage_export_request_id
        - status
        - scope_label
        - requested_by_label
        - filter_snapshot
        - row_count
        - created_at
        - audit_reference
      properties:
        usage_export_request_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UsageReactExportStatus"
        scope_label:
          type: string
        requested_by_label:
          type: string
        filter_snapshot:
          type: object
          additionalProperties:
            type: string
        row_count:
          type: integer
          minimum: 0
        artifact_reference:
          type: [string, "null"]
        artifact_size_label:
          type: [string, "null"]
        checksum_prefix:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        audit_reference:
          type: string
        denial_reason:
          type: [string, "null"]
        failure_reason:
          type: [string, "null"]
        next_step:
          type: string
    UsageReactProblem:
      type: object
      required: [reason, title, detail, next_action]
      properties:
        reason:
          type: string
          enum:
            - denied
            - empty
            - partial
            - unavailable
            - stale_pricing
            - export_pending
            - audit_unavailable
            - unsupported_filter
            - invalid_range
        title:
          type: string
        detail:
          type: string
        next_action:
          type: string
        audit_reference:
          type: [string, "null"]
