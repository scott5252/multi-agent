openapi: 3.1.0
info:
  title: React Workflow Builder Contracts
  version: qa030
paths:
  /admin/app/workflows:
    get:
      summary: Serve protected React workflow builder shell
      responses:
        "200":
          description: React shell HTML
        "401":
          description: Authentication required
        "403":
          description: Scope denied
  /admin/app/workflows/builder.json:
    get:
      summary: Load workflow builder bootstrap envelope
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: workflow_draft_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Builder envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowBuilderEnvelope"
        "401":
          description: Authentication required
        "403":
          description: Scope denied
  /admin/app/workflows/lookups.json:
    get:
      summary: Load backend-owned workflow reference lookup options
      responses:
        "200":
          description: Reference catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowReferenceCatalog"
  /admin/app/workflows/drafts/{workflow_draft_id}/save:
    post:
      summary: Save an explicit semantic draft revision
      parameters:
        - name: workflow_draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDraftSaveRequest"
      responses:
        "200":
          description: Save result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderMutationResult"
  /admin/app/workflows/drafts/{workflow_draft_id}/validate:
    post:
      summary: Run backend workflow validation
      parameters:
        - name: workflow_draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderMutationResult"
  /admin/app/workflows/drafts/{workflow_draft_id}/publish:
    post:
      summary: Request publish gate decision and publish when ready
      parameters:
        - name: workflow_draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowPublishRequest"
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderMutationResult"
components:
  schemas:
    WorkflowBuilderEnvelope:
      type: object
      required:
        - page_id
        - title
        - scope
        - draft
        - graph_preview
        - validation
        - publish_readiness
      properties:
        page_id:
          type: string
        title:
          type: string
        description:
          type: string
        scope:
          $ref: "#/components/schemas/ReactAdminScope"
        draft:
          $ref: "#/components/schemas/WorkflowDraftDocument"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSection"
        reference_catalog:
          $ref: "#/components/schemas/WorkflowReferenceCatalog"
        graph_preview:
          $ref: "#/components/schemas/WorkflowGraphPreview"
        validation:
          $ref: "#/components/schemas/WorkflowValidationSummary"
        publish_readiness:
          $ref: "#/components/schemas/WorkflowPublishReadiness"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRevisionSummary"
        json_inspector:
          $ref: "#/components/schemas/WorkflowJsonInspector"
    ReactAdminScope:
      type: object
      properties:
        scope_type:
          type: string
          enum: [platform, tenant]
        tenant_id:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
    WorkflowDraftDocument:
      type: object
      required: [workflow_draft_id, revision, name, status, graph]
      properties:
        workflow_draft_id:
          type: string
          format: uuid
        workflow_lineage_id:
          type: string
          format: uuid
        revision:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, dirty, validating, ready, blocked, stale, published]
        graph:
          $ref: "#/components/schemas/WorkflowGraphPreview"
    BuilderSection:
      type: object
      required: [section_id, label, status]
      properties:
        section_id:
          type: string
        label:
          type: string
        status:
          type: string
        summary:
          type: string
    WorkflowReferenceCatalog:
      type: object
      properties:
        prompt_options:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowReferenceOption"
        profile_options:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowReferenceOption"
        provider_options:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowReferenceOption"
        skill_options:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowReferenceOption"
        test_suite_options:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowReferenceOption"
    WorkflowReferenceOption:
      type: object
      required: [reference_id, label, kind, readiness_status]
      properties:
        reference_id:
          type: string
        label:
          type: string
        kind:
          type: string
        readiness_status:
          type: string
        tenant_eligible:
          type: boolean
        safe_summary:
          type: string
        href:
          type: string
    WorkflowGraphPreview:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowGraphEdge"
        join_policies:
          type: array
          items:
            type: string
        layout_revision:
          type: string
    WorkflowGraphNode:
      type: object
      required: [node_id, label, node_type, status]
      properties:
        node_id:
          type: string
        label:
          type: string
        node_type:
          type: string
        status:
          type: string
    WorkflowGraphEdge:
      type: object
      required: [edge_id, source, target]
      properties:
        edge_id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string
    WorkflowValidationSummary:
      type: object
      properties:
        status:
          type: string
        summary:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFinding"
    ValidationFinding:
      type: object
      properties:
        finding_id:
          type: string
        severity:
          type: string
        category:
          type: string
        message:
          type: string
    WorkflowPublishReadiness:
      type: object
      properties:
        decision:
          type: string
        summary:
          type: string
        blockers:
          type: array
          items:
            type: string
        required_evidence:
          type: array
          items:
            type: string
    WorkflowRevisionSummary:
      type: object
      properties:
        revision:
          type: string
        created_at_label:
          type: string
        actor_label:
          type: string
        summary:
          type: string
    WorkflowJsonInspector:
      type: object
      properties:
        collapsed_by_default:
          type: boolean
        summary:
          type: string
        redaction_summary:
          type: string
        artifact_reference_id:
          type: string
    WorkflowDraftSaveRequest:
      type: object
      required: [revision, draft]
      properties:
        revision:
          type: string
        draft:
          $ref: "#/components/schemas/WorkflowDraftDocument"
        idempotency_key:
          type: string
    WorkflowPublishRequest:
      type: object
      properties:
        revision:
          type: string
        confirmed:
          type: boolean
        idempotency_key:
          type: string
    BuilderMutationResult:
      type: object
      properties:
        status:
          type: string
        summary:
          type: string
        revision:
          type: string
        audit_reference_id:
          type: string
        validation:
          $ref: "#/components/schemas/WorkflowValidationSummary"
        publish_readiness:
          $ref: "#/components/schemas/WorkflowPublishReadiness"
