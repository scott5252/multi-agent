{
  "schema_version": "1.0",
  "manual_qa_user_guide": {
    "output_file": "${manual_qa_user_guide}",
    "audience": "non-developer manual QA reviewers",
    "creation_instruction": "Create a detailed user guide that gives non-developers a plain-language overview of ${spec_title} and step-by-step manual QA instructions. The guide must explain what the feature is for, how to prepare the local QA environment, how to sign in, which screens to visit, which form fields to use, what each action proves, what expected results look like, what screenshots or notes to collect, how to verify tenant isolation and redaction, and how to distinguish expected limitations from regressions.",
    "minimum_lines": 160,
    "required_sections": [
      "# ${qa_label} User Guide: ${spec_title}",
      "## Detailed Overview",
      "## Who Should Use This Guide",
      "## Manual QA Prerequisites",
      "## Step-by-Step Manual QA",
      "## Expected Results",
      "## Evidence To Capture",
      "## Security And Redaction Checks",
      "## Tenant Isolation Checks",
      "## Troubleshooting"
    ]
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "processes": [
    {
      "id": "api",
      "command": "uv run uvicorn multi_agent_platform.api.main:app --host 127.0.0.1 --port 8000",
      "readiness_url": "http://127.0.0.1:8000/health/live",
      "timeout_seconds": 30,
      "log_file": "/tmp/${qa_id}-api.log"
    },
    {
      "id": "worker",
      "command": "uv run python -m multi_agent_platform.workers.main",
      "log_file": "/tmp/${qa_id}-worker.log"
    }
  ],
  "commands": [
    {
      "id": "health-live",
      "command": "curl --fail --silent http://127.0.0.1:8000/health/live",
      "expect_exit_code": 0
    },
    {
      "id": "health-ready",
      "command": "curl --fail --silent http://127.0.0.1:8000/health/ready",
      "expect_exit_code": 0
    },
    {
      "id": "version",
      "command": "curl --fail --silent http://127.0.0.1:8000/version",
      "expect_exit_code": 0
    },
    {
      "id": "dependencies",
      "command": "curl --fail --silent http://127.0.0.1:8000/dependencies",
      "expect_exit_code": 0
    }
  ],
  "playwright": {
    "base_url": "http://127.0.0.1:8000",
    "output_dir": "${playwright_output_dir}",
    "flows": []
  },
  "quality_commands": [
    {
      "id": "manual-qa-user-guide-required",
      "command": "test -s ${manual_qa_user_guide} && test $(wc -l < ${manual_qa_user_guide} | tr -d ' ') -ge 160 && grep -q '^# ${qa_label} User Guide: ${spec_title}' ${manual_qa_user_guide} && grep -q '^## Detailed Overview' ${manual_qa_user_guide} && grep -q '^## Step-by-Step Manual QA' ${manual_qa_user_guide} && grep -q '^## Expected Results' ${manual_qa_user_guide} && grep -q '^## Troubleshooting' ${manual_qa_user_guide}",
      "expect_exit_code": 0
    },
    {
      "id": "ruff-check",
      "command": "uv run ruff check .",
      "expect_exit_code": 0
    },
    {
      "id": "ruff-format-check",
      "command": "uv run ruff format --check .",
      "expect_exit_code": 0
    },
    {
      "id": "mypy",
      "command": "uv run mypy src",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "pytest-coverage",
      "command": "uv run pytest --cov=src/multi_agent_platform --cov-report=term-missing --cov-fail-under=90",
      "expect_exit_code": 0,
      "timeout_seconds": 900
    }
  ]
}
