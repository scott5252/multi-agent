{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 063 - Admin Design Review Workspace",
    "spec_number": "063",
    "spec_slug": "admin-design-review-workspace",
    "feature_dir": "specs/063-admin-design-review-workspace",
    "autopilot_dir": "specs/_autopilot/scenario-enhancement-roadmap/063-admin-design-review-workspace",
    "branch": "codex/063-admin-design-review-workspace",
    "qa_id": "qa063",
    "qa_label": "QA063",
    "qa_database": "multi_agent_platform_qa063",
    "qa_env_file": "specs/063-admin-design-review-workspace/.env.qa063",
    "artifact_root": ".data/qa063-artifacts",
    "playwright_output_dir": "output/playwright/qa063_ui",
    "manual_qa_user_guide": "specs/063-admin-design-review-workspace/qa063_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa063-after-spec"
  },
  "extra_commands": [
    {
      "id": "seed-design-review-workspace-qa063",
      "command": "uv run python scripts/qa/seed_design_review_workspace_qa063.py | tee /tmp/qa063-seed.txt",
      "expect_exit_code": 0,
      "expect_contains": [
        "Seeded QA063 design review workspace live records"
      ]
    },
    {
      "id": "verify-design-review-workspace-qa063",
      "command": "uv run python scripts/qa/verify_design_review_workspace_qa063.py | tee /tmp/qa063-post-ui-evidence.txt",
      "expect_exit_code": 0,
      "expect_contains": [
        "Verified QA063 design review workspace live data"
      ]
    }
  ],
  "playwright_pre_commands": [
    {
      "id": "seed-design-review-workspace-qa063-before-ui",
      "command": "uv run python scripts/qa/seed_design_review_workspace_qa063.py | tee /tmp/qa063-ui-seed.txt",
      "expect_exit_code": 0,
      "expect_contains": [
        "Seeded QA063 design review workspace live records"
      ]
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa063-scenario-enhancement-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/design-reviews"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"tenant-admin-acme\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "QA063 workspace seeded design review."
          },
          {
            "screenshot": "qa063-scenario-enhancement-smoke.png",
            "full_page": false
          }
        ]
      }
    ]
  },
  "post_spec_validation": {
    "curl_testing": {
      "file": "curl_testing.md",
      "require_update_when_public_api_changes": true,
      "require_commands_for_new_route_families": true,
      "evidence_note": "Record the curl_testing.md sections covering new or changed APIs in this spec's status.json."
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "if ! docker info >/dev/null 2>&1; then command -v open >/dev/null 2>&1 && open -a Docker || true; for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 5; done; fi; docker info >/dev/null && docker compose up -d postgres && uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
