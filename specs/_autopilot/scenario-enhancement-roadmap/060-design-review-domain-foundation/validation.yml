{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 060 - Design Review Domain Foundation",
    "spec_number": "060",
    "spec_slug": "design-review-domain-foundation",
    "feature_dir": "specs/060-design-review-domain-foundation",
    "autopilot_dir": "specs/_autopilot/scenario-enhancement-roadmap/060-design-review-domain-foundation",
    "branch": "codex/060-design-review-domain-foundation",
    "qa_id": "qa060",
    "qa_label": "QA060",
    "qa_database": "multi_agent_platform_qa060",
    "qa_env_file": "specs/060-design-review-domain-foundation/.env.qa060",
    "artifact_root": ".data/qa060-artifacts",
    "playwright_output_dir": "output/playwright/qa060_ui",
    "manual_qa_user_guide": "specs/060-design-review-domain-foundation/qa060_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa060-after-spec"
  },
  "extra_commands": [
    {
      "id": "seed-design-review-qa060",
      "command": "uv run python scripts/qa/seed_design_review_qa060.py | tee /tmp/qa060-seed.txt",
      "expect_exit_code": 0,
      "expect_contains": [
        "Seeded QA060 design review live records"
      ]
    },
    {
      "id": "exercise-design-review-api-qa060",
      "command": "uv run python scripts/qa/exercise_design_review_api_qa060.py",
      "expect_exit_code": 0,
      "expect_contains": [
        "Exercised QA060 design review API routes"
      ]
    },
    {
      "id": "verify-design-review-persistence-qa060",
      "command": "uv run python scripts/qa/verify_design_review_qa060.py",
      "expect_exit_code": 0,
      "expect_contains": [
        "Verified QA060 design review live-data persistence"
      ]
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa060-scenario-enhancement-smoke",
        "steps": [
          {
            "goto": "/openapi.json"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "design"
          },
          {
            "screenshot": "qa060-scenario-enhancement-smoke.png",
            "full_page": false
          }
        ]
      }
    ]
  },
  "post_spec_validation": {
    "curl_testing": {
      "file": "curl_testing.md",
      "require_update_when_public_api_changes": true,
      "require_commands_for_new_route_families": true,
      "evidence_note": "Record the curl_testing.md sections covering new or changed APIs in this spec's status.json."
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "if ! docker info >/dev/null 2>&1; then command -v open >/dev/null 2>&1 && open -a Docker || true; for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 5; done; fi; docker info >/dev/null && docker compose up -d postgres && uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
