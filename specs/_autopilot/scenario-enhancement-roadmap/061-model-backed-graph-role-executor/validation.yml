{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 061 - Model-Backed Graph Role Executor",
    "spec_number": "061",
    "spec_slug": "model-backed-graph-role-executor",
    "feature_dir": "specs/061-model-backed-graph-role-executor",
    "autopilot_dir": "specs/_autopilot/scenario-enhancement-roadmap/061-model-backed-graph-role-executor",
    "branch": "codex/061-model-backed-graph-role-executor",
    "qa_id": "qa061",
    "qa_label": "QA061",
    "qa_database": "multi_agent_platform_qa061",
    "qa_env_file": "specs/061-model-backed-graph-role-executor/.env.qa061",
    "artifact_root": ".data/qa061-artifacts",
    "playwright_output_dir": "output/playwright/qa061_ui",
    "manual_qa_user_guide": "specs/061-model-backed-graph-role-executor/qa061_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa061-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa061-scenario-enhancement-smoke",
        "steps": [
          {
            "goto": "/health/ready"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "ready"
          },
          {
            "screenshot": "qa061-scenario-enhancement-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "post_spec_validation": {
    "curl_testing": {
      "file": "curl_testing.md",
      "require_update_when_public_api_changes": true,
      "require_commands_for_new_route_families": true,
      "evidence_note": "Record the curl_testing.md sections covering new or changed APIs in this spec's status.json."
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "if ! docker info >/dev/null 2>&1; then command -v open >/dev/null 2>&1 && open -a Docker || true; for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 5; done; fi; docker info >/dev/null && docker compose up -d postgres && uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
