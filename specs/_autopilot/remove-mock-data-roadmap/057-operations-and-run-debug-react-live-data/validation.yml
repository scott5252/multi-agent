{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 057 - Operations And Run Debug React Live Data",
    "spec_number": "057",
    "spec_slug": "operations-and-run-debug-react-live-data",
    "feature_dir": "specs/057-operations-and-run-debug-react-live-data",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/057-operations-and-run-debug-react-live-data",
    "branch": "codex/057-operations-and-run-debug-react-live-data",
    "qa_id": "qa057",
    "qa_label": "QA057",
    "qa_database": "multi_agent_platform_qa057",
    "qa_env_file": "specs/057-operations-and-run-debug-react-live-data/.env.qa057",
    "artifact_root": ".data/qa057-artifacts",
    "playwright_output_dir": "output/playwright/qa057_ui",
    "manual_qa_user_guide": "specs/057-operations-and-run-debug-react-live-data/qa057_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa057-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa057-live-data-ui-api-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/operations%3Ftenant_id%3D11111111-1111-1111-1111-111111111111"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"tenant-admin-acme\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Operations workbench"
          },
          {
            "expect_text": "Tenant live evidence"
          },
          {
            "expect_text": "Live tool call completed with a safe summary."
          },
          {
            "expect_text": "Safe evidence package"
          },
          {
            "click": "button:has-text(\"Export evidence\")"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "operations-export:"
          },
          {
            "expect_text": "Workbench export persisted with safe artifact metadata."
          },
          {
            "screenshot": "qa057-live-data-ui-api-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-operations-live-data",
      "command": "uv run python scripts/qa/seed_operations_qa057.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120,
      "expect_contains": "Seeded QA057 operations live records"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "operations-bootstrap-platform-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/operations.json'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Operations workbench",
        "Live operations source",
        "Live run started with persisted audit evidence.",
        "Gateway attempt recorded retryable timeout category.",
        "trace-qa057-live-run",
        "operations-export:empty"
      ],
      "expect_not_contains": [
        "qa029",
        "qa029-secret-value",
        "private channel message",
        "telegram update payload",
        "provider authorization",
        "raw provider response",
        "raw tool result",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "operations-bootstrap-tenant-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/operations.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Tenant live evidence",
        "Live tool call completed with a safe summary.",
        "Telegram delivery is queued for a live retry.",
        "Model provider",
        "operations-export:empty"
      ],
      "expect_not_contains": [
        "Model Providers",
        "DB Pool Pressure",
        "OpenAI provider",
        "gpt-qa057-live",
        "/admin/app/governance/providers",
        "qa029",
        "qa029-secret-value",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "operations-run-debug-tenant-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/operations/runs/57000000-0000-0000-0000-000000000057.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Workflow run 57000000 from live audit evidence",
        "Weather live summary",
        "Live briefing alias",
        "Model provider",
        "allowed_read_only",
        "telegram-retry-scheduled"
      ],
      "expect_not_contains": [
        "OpenAI provider",
        "gpt-qa057-live",
        "/admin/app/governance/providers",
        "qa029",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "operations-export-tenant-created",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' -H 'Content-Type: application/json' -d '{\"scope_type\":\"active\",\"range\":\"60m\",\"include_run_debug\":true,\"included_sections\":[\"summary\",\"logs\",\"run_debug\",\"reliability\",\"exports\"]}' 'http://127.0.0.1:8000/admin/app/operations/export?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "complete",
        "operations-export:",
        "Workbench export persisted with safe artifact metadata.",
        "row_count"
      ],
      "expect_not_contains": [
        "file:",
        "/Users/",
        "qa057/exports",
        "qa029",
        "provider authorization",
        "raw provider response",
        "raw tool result"
      ]
    },
    {
      "id": "operations-globex-empty",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-globex' 'http://127.0.0.1:8000/admin/app/operations.json?tenant_id=22222222-2222-2222-2222-222222222222'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Globex has 0 live operational rows and 0 visible runs in the selected range.",
        "Tenant live evidence",
        "No tenant-visible reliability recovery records matched the selected range.",
        "operations-export:empty"
      ],
      "expect_not_contains": [
        "Live run started with persisted audit evidence.",
        "trace-qa057-live-run",
        "Gateway attempt recorded retryable timeout category.",
        "operations-export:57000000",
        "qa029"
      ]
    },
    {
      "id": "operations-cross-tenant-denied",
      "command": "status=$(curl --silent --output /tmp/qa057-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/operations.json?tenant_id=22222222-2222-2222-2222-222222222222'); test \"$status\" = 403 && ! grep -q 'Live run started with persisted audit evidence.' /tmp/qa057-cross-tenant.json && ! grep -q 'Globex' /tmp/qa057-cross-tenant.json",
      "expect_exit_code": 0
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-admin-react-types",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "focused-operations-backend-tests",
      "command": "uv run pytest --no-cov tests/unit/api/test_admin_workbench_schema.py tests/unit/operations/test_workbench_service.py tests/integration/test_admin_react_routes.py tests/performance/operations/test_workbench_queries.py tests/unit/admin/test_live_data_inventory_scanner.py -k 'workbench or react_admin_operations or live_data_inventory or operations_marker' -q",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-workbench-tests",
      "command": "npm run --prefix frontend/admin test -- --run Workbench",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-typecheck",
      "command": "npm run --prefix frontend/admin typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "npm run --prefix frontend/admin build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    }
  ],
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright logs in as tenant-admin-acme, renders seeded QA057 live operations and run-debug evidence, clicks Export evidence, verifies a safe operations-export reference, and captures a screenshot. Post-UI verification must run scripts/qa/verify_operations_qa057.py against multi_agent_platform_qa057 to prove the browser action persisted an export audit row with checksum, safe artifact reference, and row count.",
    "post_ui_database_check": "uv run python scripts/qa/verify_operations_qa057.py",
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
