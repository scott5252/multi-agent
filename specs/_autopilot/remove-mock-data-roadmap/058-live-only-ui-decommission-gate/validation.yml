{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 058 - Live-Only UI Decommission Gate",
    "spec_number": "058",
    "spec_slug": "live-only-ui-decommission-gate",
    "feature_dir": "specs/058-live-only-ui-decommission-gate",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/058-live-only-ui-decommission-gate",
    "branch": "codex/058-live-only-ui-decommission-gate",
    "qa_id": "qa058",
    "qa_label": "QA058",
    "qa_database": "multi_agent_platform_qa058",
    "qa_env_file": "specs/058-live-only-ui-decommission-gate/.env.qa058",
    "artifact_root": ".data/qa058-artifacts",
    "playwright_output_dir": "output/playwright/qa058_ui",
    "manual_qa_user_guide": "specs/058-live-only-ui-decommission-gate/qa058_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa058-after-spec"
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-live-only-gate-data",
      "command": "uv run python scripts/qa/seed_live_only_gate_qa058.py",
      "expect_exit_code": 0,
      "timeout_seconds": 240,
      "expect_contains": "Seeded QA058 live-only gate records"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa058-live-data-ui-api-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/migration"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"platform-admin\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Live-data guardrails"
          },
          {
            "expect_text": "Live-only gate"
          },
          {
            "expect_text": "qa058-live-only-source-scan"
          },
          {
            "expect_text": "Route targets"
          },
          {
            "expect_text": "Spec 059 owns the remaining transitional bootstrap marker"
          },
          {
            "screenshot": "qa058-live-data-ui-api-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "extra_commands": [
    {
      "id": "live-data-inventory-source-scan",
      "command": "curl --fail --silent -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/migration/live-data-inventory.json?ci_mode=true'",
      "expect_exit_code": 0,
      "expect_contains": [
        "qa058-live-only-gate",
        "qa058-live-only-source-scan",
        "qa058-route-response-scan",
        "transitional_marker_deferred",
        "\"blocking_findings\":0",
        "\"mapped_legacy_findings\":1"
      ],
      "expect_not_contains": [
        "qa058-secret-value",
        "raw prompt",
        "raw completion",
        "private message",
        "raw tool payload",
        "raw test transcript",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "live-data-inventory-projected",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/migration/live-data-inventory.json?tenant_id=11111111-1111-1111-1111-111111111111&ci_mode=true&source_scan=false'",
      "expect_exit_code": 0,
      "expect_contains": [
        "qa058-live-only-gate",
        "\"blocking_findings\":0",
        "\"mapped_legacy_findings\":1",
        "Spec 059 owns the remaining transitional bootstrap marker"
      ],
      "expect_not_contains": [
        "Globex",
        "qa058-secret-value",
        "raw prompt",
        "raw completion",
        "/Users/"
      ]
    },
    {
      "id": "live-data-inventory-cross-tenant-denied",
      "command": "status=$(curl --silent --output /tmp/qa058-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/migration/live-data-inventory.json?tenant_id=22222222-2222-2222-2222-222222222222'); test \"$status\" = 403 && ! grep -q 'Globex' /tmp/qa058-cross-tenant.json && ! grep -q 'qa058-live-only-gate' /tmp/qa058-cross-tenant.json",
      "expect_exit_code": 0
    },
    {
      "id": "qa058-post-ui-verifier",
      "command": "uv run python scripts/qa/verify_live_only_gate_qa058.py",
      "expect_exit_code": 0,
      "expect_contains": [
        "Verified QA058 live-only gate",
        "blocking_findings=0",
        "missed_static_routes=0",
        "built_asset_blockers=0"
      ],
      "expect_not_contains": [
        "/Users/",
        "raw prompt",
        "raw completion"
      ]
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-admin-react-types",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "focused-live-only-gate-tests",
      "command": "uv run pytest --no-cov tests/unit/admin/test_live_data_inventory_scanner.py tests/contract/test_admin_live_data_inventory_contract.py tests/integration/api/test_admin_live_data_inventory_routes.py tests/unit/api/test_admin_migration_hardening_react_schema.py -q",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-migration-hardening-tests",
      "command": "npm run --prefix frontend/admin test -- --run migrationHardening",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-typecheck",
      "command": "npm run --prefix frontend/admin typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "npm run --prefix frontend/admin build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    }
  ],
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright opens the migration live-data inventory UI and validates the backend-owned final gate summary. The post-UI verifier writes .data/qa058-artifacts/live-only-gate-report.json and proves zero blocking findings, zero missed static routes, and zero built-asset blockers.",
    "post_ui_database_check": {
      "command": "uv run python scripts/qa/verify_live_only_gate_qa058.py",
      "expected_output": "Verified QA058 live-only gate"
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
