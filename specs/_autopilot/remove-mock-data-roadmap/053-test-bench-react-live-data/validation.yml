{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 053 - Test Bench React Live Data",
    "spec_number": "053",
    "spec_slug": "test-bench-react-live-data",
    "feature_dir": "specs/053-test-bench-react-live-data",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/053-test-bench-react-live-data",
    "branch": "codex/053-test-bench-react-live-data",
    "qa_id": "qa053",
    "qa_label": "QA053",
    "qa_database": "multi_agent_platform_qa053",
    "qa_env_file": "specs/053-test-bench-react-live-data/.env.qa053",
    "artifact_root": ".data/qa053-artifacts",
    "playwright_output_dir": "output/playwright/qa053_ui",
    "manual_qa_user_guide": "specs/053-test-bench-react-live-data/qa053_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa053-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa053-live-data-ui-api-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/test-bench"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"tenant-admin-acme\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Test Bench"
          },
          {
            "expect_text": "QA053 live daily briefing release gate"
          },
          {
            "expect_text": "Briefing summary contract"
          },
          {
            "click": "button:has-text(\"Save suite\")"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Test suite saved with repository-backed target revision binding."
          },
          {
            "screenshot": "qa053-live-data-ui-api-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-test-bench-live-data",
      "command": "uv run python scripts/qa/seed_test_bench_qa053.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120,
      "expect_contains": "Seeded QA053 test bench live records"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "test-bench-bootstrap-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "QA053 live daily briefing release gate",
        "Agent test bench records",
        "Current target revision has passing evidence"
      ],
      "expect_not_contains": [
        "qa033-secret-value",
        "raw prompt",
        "raw completion",
        "raw transcript",
        "connector payload",
        "storage path"
      ]
    },
    {
      "id": "test-bench-run-detail-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/runs/53000000-0000-0000-0000-000000000004.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Blocked side-effect assertion failed",
        "sha256:qa053liveartifactsummary"
      ],
      "expect_not_contains": [
        "raw transcript",
        "connector request",
        "authorization header"
      ]
    },
    {
      "id": "test-bench-gates-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/gates.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "QA053 live daily briefing release gate",
        "passed"
      ],
      "expect_not_contains": "Globex"
    },
    {
      "id": "test-bench-cross-tenant-empty",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-globex' 'http://127.0.0.1:8000/admin/app/test-bench/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222'",
      "expect_exit_code": 0,
      "expect_contains": "No test bench records found",
      "expect_not_contains": "QA053 live daily briefing release gate"
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-admin-react-types",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "focused-test-bench-backend-tests",
      "command": "uv run pytest --no-cov tests/unit/api/test_admin_test_bench_schema.py tests/unit/admin/test_test_bench_react_service.py tests/integration/test_admin_react_routes.py tests/contract/test_admin_react_contract.py tests/performance/test_bench/test_react_test_bench_queries.py tests/unit/admin/test_live_data_inventory_scanner.py -q",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-test-bench-tests",
      "command": "npm run --prefix frontend/admin test -- --run src/components/testBench",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-typecheck",
      "command": "npm run --prefix frontend/admin typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "npm run --prefix frontend/admin build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    }
  ],
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright logs in as tenant-admin-acme, renders seeded QA053 test bench live records, clicks Save suite, verifies the accepted mutation result, and captures a screenshot. Post-UI verification must run scripts/qa/verify_test_bench_qa053.py against multi_agent_platform_qa053 to prove the suite revision was persisted through the backend.",
    "post_ui_database_check": "uv run python scripts/qa/verify_test_bench_qa053.py",
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
