{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 059 - Admin UI Transitional React Label Removal",
    "spec_number": "059",
    "spec_slug": "admin-ui-transitional-react-label-removal",
    "feature_dir": "specs/059-admin-ui-transitional-react-label-removal",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/059-admin-ui-transitional-react-label-removal",
    "branch": "codex/059-admin-ui-transitional-react-label-removal",
    "qa_id": "qa059",
    "qa_label": "QA059",
    "qa_database": "multi_agent_platform_qa059",
    "qa_env_file": "specs/059-admin-ui-transitional-react-label-removal/.env.qa059",
    "artifact_root": ".data/qa059-artifacts",
    "playwright_output_dir": "output/playwright/qa059_ui",
    "manual_qa_user_guide": "specs/059-admin-ui-transitional-react-label-removal/qa059_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa059-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa059-admin-terminology-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"platform-admin\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Admin"
          },
          {
            "screenshot": "qa059-admin-entry.png",
            "full_page": true
          },
          {
            "goto": "/admin/app/skills"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Skill lifecycle"
          },
          {
            "goto": "/admin/app/migration"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Admin browser UI"
          },
          {
            "expect_text": "Transitional label gate"
          },
          {
            "expect_text": "Admin terminology gate passed"
          },
          {
            "screenshot": "qa059-domain-pages.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-transitional-label-data",
      "command": "uv run python scripts/qa/seed_transitional_labels_qa059.py",
      "expect_exit_code": 0,
      "timeout_seconds": 300,
      "expect_contains": "Seeded QA059 transitional label records"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "transitional-label-gate-source-scan",
      "command": "curl --fail --silent -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/migration/transitional-labels.json?ci_mode=true'",
      "expect_exit_code": 0,
      "expect_contains": [
        "qa059-transitional-label-gate",
        "\"blocked_count\":0",
        "\"ci_status\":\"pass\"",
        "qa059-source-visible-text-scan",
        "Admin terminology gate passed"
      ],
      "expect_not_contains": [
        "React Admin",
        "React admin",
        "React-only",
        "qa059-secret-value",
        "raw prompt",
        "raw completion",
        "private message",
        "raw tool payload",
        "raw test transcript",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "transitional-label-gate-projection",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/migration/transitional-labels.json?tenant_id=11111111-1111-1111-1111-111111111111&source_scan=false'",
      "expect_exit_code": 0,
      "expect_contains": [
        "qa059-transitional-label-gate",
        "\"blocked_count\":0",
        "\"allowed_reference_count\":3"
      ],
      "expect_not_contains": [
        "Globex",
        "React Admin",
        "React-only",
        "qa059-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "transitional-label-gate-cross-tenant-denied",
      "command": "status=$(curl --silent --output /tmp/qa059-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/migration/transitional-labels.json?tenant_id=22222222-2222-2222-2222-222222222222'); test \"$status\" = 403 && ! grep -q 'Globex' /tmp/qa059-cross-tenant.json && ! grep -q 'qa059-transitional-label-gate' /tmp/qa059-cross-tenant.json",
      "expect_exit_code": 0
    },
    {
      "id": "qa059-post-ui-verifier",
      "command": "uv run python scripts/qa/verify_transitional_labels_qa059.py",
      "expect_exit_code": 0,
      "expect_contains": [
        "Verified QA059 transitional label gate",
        "blocked_count=0",
        "ci_status=pass"
      ],
      "expect_not_contains": [
        "React Admin",
        "/Users/",
        "raw prompt",
        "raw completion"
      ]
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-admin-react-types",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "focused-transitional-label-tests",
      "command": "uv run pytest --no-cov tests/unit/admin/test_transitional_label_scanner.py tests/contract/test_admin_transitional_label_gate_contract.py tests/integration/api/test_admin_transitional_label_routes.py tests/unit/api/test_admin_migration_hardening_react_schema.py tests/integration/api/test_admin_live_data_inventory_routes.py -q",
      "expect_exit_code": 0,
      "timeout_seconds": 240
    },
    {
      "id": "frontend-migration-hardening-tests",
      "command": "npm run --prefix frontend/admin test -- --run migrationHardening",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-shell-app-tests",
      "command": "npm run --prefix frontend/admin test -- --run App bootstrapContract shell",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-typecheck",
      "command": "npm run --prefix frontend/admin typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "npm run --prefix frontend/admin build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    }
  ],
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright logs in as platform-admin, opens the Admin shell, opens a representative domain page, opens migration evidence, and captures qa059-admin-entry.png plus qa059-domain-pages.png. The post-UI verifier writes .data/qa059-artifacts/transitional-label-gate-report.json and proves zero blocked transitional labels.",
    "post_ui_database_check": {
      "command": "uv run python scripts/qa/verify_transitional_labels_qa059.py",
      "expected_output": "Verified QA059 transitional label gate"
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
