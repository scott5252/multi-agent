{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 056 - Usage React Live Data",
    "spec_number": "056",
    "spec_slug": "usage-react-live-data",
    "feature_dir": "specs/056-usage-react-live-data",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/056-usage-react-live-data",
    "branch": "codex/056-usage-react-live-data",
    "qa_id": "qa056",
    "qa_label": "QA056",
    "qa_database": "multi_agent_platform_qa056",
    "qa_env_file": "specs/056-usage-react-live-data/.env.qa056",
    "artifact_root": ".data/qa056-artifacts",
    "playwright_output_dir": "output/playwright/qa056_ui",
    "manual_qa_user_guide": "specs/056-usage-react-live-data/qa056_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa056-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa056-live-data-ui-api-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/usage%3Ftenant_id%3D11111111-1111-1111-1111-111111111111"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"tenant-admin-acme\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Usage and Cost Analytics"
          },
          {
            "expect_text": "1,860"
          },
          {
            "expect_text": "Usage export metadata lookup"
          },
          {
            "click": "button:has-text(\"Export CSV\")"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "usage-export:"
          },
          {
            "expect_text": "completed"
          },
          {
            "screenshot": "qa056-live-data-ui-api-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-usage-live-data",
      "command": "uv run python scripts/qa/seed_usage_qa056.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120,
      "expect_contains": "Seeded QA056 usage live records"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "usage-bootstrap-platform-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/usage/bootstrap.json?group_by=tenant'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Usage and Cost Analytics",
        "Acme",
        "1,860",
        "usage-analytics-live",
        "usage-export:56000000-0000-0000-0000-000000000056",
        "Missing pricing",
        "Reconciliation pending"
      ],
      "expect_not_contains": [
        "USAGE_EVENTS",
        "qa035-secret-value",
        "raw prompt",
        "raw completion",
        "authorization header",
        "credential value",
        "provider token",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "usage-events-governed-tool-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/usage/events.json?group_by=governed_tool'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Usage export metadata lookup",
        "trace-qa056-live-usage",
        "usage-event:56000000-0000-0000-0000-000000000011"
      ],
      "expect_not_contains": [
        "qa035-secret-value",
        "raw prompt",
        "raw completion",
        "authorization header",
        "credential value",
        "provider token",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "usage-export-detail-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/usage/exports/56000000-0000-0000-0000-000000000056.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "completed",
        "usage-export:56000000-0000-0000-0000-000000000056",
        "sha256:aaaaaaaaaaaa"
      ],
      "expect_not_contains": [
        "qa056/exports/seeded-usage.csv",
        "file:",
        "/Users/",
        "raw prompt",
        "credential value"
      ]
    },
    {
      "id": "usage-cross-tenant-denied-export",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' -H 'Content-Type: application/json' -d '{\"filters\":{\"tenant_id\":\"22222222-2222-2222-2222-222222222222\"},\"requested_group_by\":\"provider\",\"idempotency_key\":\"qa056-denied-export\"}' 'http://127.0.0.1:8000/admin/app/usage/exports?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "denied",
        "cross_tenant_scope"
      ],
      "expect_not_contains": [
        "Usage live review workflow",
        "trace-qa056-live-usage",
        "file:",
        "/Users/"
      ]
    },
    {
      "id": "usage-globex-empty",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-globex' 'http://127.0.0.1:8000/admin/app/usage/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222'",
      "expect_exit_code": 0,
      "expect_contains": [
        "No usage events",
        "No live usage events match the active filters."
      ],
      "expect_not_contains": [
        "Usage live review workflow",
        "trace-qa056-live-usage",
        "Usage export metadata lookup",
        "usage-export:56000000-0000-0000-0000-000000000056"
      ]
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-admin-react-types",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "focused-usage-backend-tests",
      "command": "uv run pytest --no-cov tests/unit/admin/usage/test_react_usage_service.py tests/unit/api/test_admin_usage_react_schema.py tests/unit/db/test_usage_repository.py tests/performance/usage/test_react_usage_queries.py tests/integration/test_admin_react_routes.py tests/unit/admin/test_live_data_inventory_scanner.py -k 'usage or react_admin_usage or live_data_inventory' -q",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-usage-tests",
      "command": "npm run --prefix frontend/admin test -- --run Usage",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-typecheck",
      "command": "npm run --prefix frontend/admin typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "npm run --prefix frontend/admin build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    }
  ],
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright logs in as tenant-admin-acme, renders seeded QA056 usage rows, clicks Export CSV, verifies a safe completed usage-export reference, and captures a screenshot. Post-UI verification must run scripts/qa/verify_usage_qa056.py against multi_agent_platform_qa056 to prove a completed export request with checksum metadata was persisted through the backend after the browser action.",
    "post_ui_database_check": "uv run python scripts/qa/verify_usage_qa056.py",
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
