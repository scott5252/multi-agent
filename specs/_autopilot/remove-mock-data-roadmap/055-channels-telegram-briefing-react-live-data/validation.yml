{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 055 - Channels, Telegram, Briefing React Live Data",
    "spec_number": "055",
    "spec_slug": "channels-telegram-briefing-react-live-data",
    "feature_dir": "specs/055-channels-telegram-briefing-react-live-data",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/055-channels-telegram-briefing-react-live-data",
    "branch": "codex/055-channels-telegram-briefing-react-live-data",
    "qa_id": "qa055",
    "qa_label": "QA055",
    "qa_database": "multi_agent_platform_qa055",
    "qa_env_file": "specs/055-channels-telegram-briefing-react-live-data/.env.qa055",
    "artifact_root": ".data/qa055-artifacts",
    "playwright_output_dir": "output/playwright/qa055_ui",
    "manual_qa_user_guide": "specs/055-channels-telegram-briefing-react-live-data/qa055_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa055-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa055-live-data-ui-api-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/channels"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"tenant-user-acme\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Channel, Telegram, and Briefing Preferences"
          },
          {
            "expect_text": "Metro area summary"
          },
          {
            "click": "button:has-text(\"Save Preferences\")"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Preference profile saved with redacted summaries."
          },
          {
            "screenshot": "qa055-live-data-ui-api-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-channel-telegram-briefing-live-data",
      "command": "uv run python scripts/qa/seed_channels_briefing_qa055.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120,
      "expect_contains": "Seeded QA055 channel Telegram briefing live records"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "channels-bootstrap-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Channel, Telegram, and Briefing Preferences",
        "Morning briefing",
        "Configured workflow",
        "tg-***-1055",
        "delivered",
        "55555555-5555-4555-8555-555555555555",
        "Webhook configuration is ready for local command validation."
      ],
      "expect_not_contains": [
        "qa036-secret-value",
        "pair-code",
        "Daily briefing workflow",
        "bot token",
        "webhook secret",
        "telegram user id",
        "telegram chat id",
        "private message",
        "raw preference",
        "raw prompt",
        "raw completion",
        "run result",
        "credential value",
        "provider token",
        "Globex Tenant Admin"
      ]
    },
    {
      "id": "channels-delivery-diagnostics-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/telegram/deliveries.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "delivered",
        "trace-qa055-delivery",
        "Webhook configuration is ready for local command validation."
      ],
      "expect_not_contains": [
        "qa036-secret-value",
        "private message",
        "raw preference",
        "provider token"
      ]
    },
    {
      "id": "channels-link-token-one-time",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' -H 'Content-Type: application/json' -d '{\"principal_label\":\"Acme briefing user\",\"expires_in_minutes\":10,\"idempotency_key\":\"qa055-link-token\"}' 'http://127.0.0.1:8000/admin/app/channels/telegram/link-tokens?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Visible once",
        "immediate"
      ],
      "expect_not_contains": [
        "qa036-secret-value",
        "pair-code",
        "provider token"
      ]
    },
    {
      "id": "channels-briefing-preferences-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-user-acme' 'http://127.0.0.1:8000/admin/app/channels/briefing/preferences.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "America/New_York",
        "Metro area summary",
        "tenant-user-acme"
      ],
      "expect_not_contains": [
        "vip@example.test",
        "raw preference",
        "credential value",
        "provider token"
      ]
    },
    {
      "id": "channels-briefing-preference-save-api",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-user-acme' -H 'Content-Type: application/json' -d '{\"timezone\":\"America/New_York\",\"location_summary\":\"Metro area summary\",\"news_topics_summary\":\"4 topic categories\",\"vip_sender_summary\":\"3 masked sender hints\",\"workday_hours\":\"08:30-17:30\",\"commute_mode\":\"transit\",\"default_account_summary\":\"2 masked account refs\",\"output_style\":\"executive\",\"scheduled_time_summary\":\"Profile preference 07:45\",\"idempotency_key\":\"qa055-pref-save-api\"}' 'http://127.0.0.1:8000/admin/app/channels/briefing/preferences?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Preference profile saved with redacted summaries.",
        "accepted"
      ],
      "expect_not_contains": [
        "vip@example.test",
        "raw preference",
        "provider token"
      ]
    },
    {
      "id": "channels-cross-tenant-empty",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-globex' 'http://127.0.0.1:8000/admin/app/channels/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222'",
      "expect_exit_code": 0,
      "expect_contains": "No live channel records",
      "expect_not_contains": [
        "Morning briefing",
        "55555555-5555-4555-8555-555555555555",
        "trace-qa055-delivery",
        "Metro area summary"
      ]
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-admin-react-types",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "focused-channel-briefing-backend-tests",
      "command": "uv run pytest --no-cov tests/unit/admin/channel_telegram_briefing/test_react_channel_telegram_briefing_service.py tests/unit/api/test_admin_channel_telegram_briefing_react_schema.py tests/performance/channel_telegram_briefing/test_react_channel_telegram_briefing_queries.py tests/integration/test_admin_react_routes.py tests/unit/admin/test_live_data_inventory_scanner.py -k 'channel_telegram_briefing or react_channels or live_data_inventory' -q",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-channel-briefing-tests",
      "command": "npm run --prefix frontend/admin test -- --run ChannelTelegramBriefing",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-typecheck",
      "command": "npm run --prefix frontend/admin typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "npm run --prefix frontend/admin build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    }
  ],
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright logs in as tenant-user-acme, renders seeded QA055 briefing/channel live rows, clicks Save Preferences, verifies the accepted mutation result, and captures a screenshot. Post-UI verification must run scripts/qa/verify_channels_briefing_qa055.py against multi_agent_platform_qa055 to prove the preference revision and audit evidence were persisted through the backend.",
    "post_ui_database_check": "uv run python scripts/qa/verify_channels_briefing_qa055.py",
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
