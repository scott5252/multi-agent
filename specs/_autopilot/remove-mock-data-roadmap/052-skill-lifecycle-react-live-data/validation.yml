{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 052 - Skill Lifecycle React Live Data",
    "spec_number": "052",
    "spec_slug": "skill-lifecycle-react-live-data",
    "feature_dir": "specs/052-skill-lifecycle-react-live-data",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/052-skill-lifecycle-react-live-data",
    "branch": "codex/052-skill-lifecycle-react-live-data",
    "qa_id": "qa052",
    "qa_label": "QA052",
    "qa_database": "multi_agent_platform_qa052",
    "qa_env_file": "specs/052-skill-lifecycle-react-live-data/.env.qa052",
    "artifact_root": ".data/qa052-artifacts",
    "playwright_output_dir": "output/playwright/qa052_ui",
    "manual_qa_user_guide": "specs/052-skill-lifecycle-react-live-data/qa052_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa052-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa052-live-data-ui-api-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/skills"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"tenant-admin-acme\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Skill lifecycle"
          },
          {
            "expect_text": "qa052-calendar-assistant"
          },
          {
            "expect_text": "QA052 Calendar OAuth reference"
          },
          {
            "click": "button:has-text(\"Save reference\")"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Credential reference configured"
          },
          {
            "screenshot": "qa052-live-data-ui-api-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-skill-lifecycle-live-data",
      "command": "uv run python scripts/qa/seed_skill_lifecycle_qa052.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120,
      "expect_contains": "Seeded QA052 skill lifecycle records"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "skills-bootstrap-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/skills/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "qa052-calendar-assistant",
        "Skill lifecycle records",
        "QA052 Calendar OAuth reference"
      ],
      "expect_not_contains": [
        "qa032-secret-value",
        "raw manifest",
        "resolved credential",
        "authorization header"
      ]
    },
    {
      "id": "skills-installations-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/skills/installations.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "qa052-calendar-assistant",
        "calendar.list"
      ],
      "expect_not_contains": [
        "raw tool output",
        "connector payload"
      ]
    },
    {
      "id": "skills-diagnostics-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/skills/diagnostics.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "calendar.list",
        "allowed_read_only"
      ],
      "expect_not_contains": "connector request"
    },
    {
      "id": "skills-cross-tenant-empty",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-globex' 'http://127.0.0.1:8000/admin/app/skills/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222'",
      "expect_exit_code": 0,
      "expect_contains": "No skill lifecycle records found",
      "expect_not_contains": "qa052-calendar-assistant"
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-admin-react-types",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "focused-skill-lifecycle-backend-tests",
      "command": "uv run pytest --no-cov tests/unit/api/test_admin_skill_lifecycle_schema.py tests/unit/admin/test_skill_lifecycle_service.py tests/performance/skills/test_skill_lifecycle_queries.py tests/unit/admin/test_live_data_inventory_scanner.py tests/integration/test_admin_react_routes.py tests/contract/test_admin_react_contract.py -q",
      "expect_exit_code": 0,
      "timeout_seconds": 240
    },
    {
      "id": "frontend-skill-lifecycle-tests",
      "command": "npm run --prefix frontend/admin test -- --run src/components/skills",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-typecheck",
      "command": "npm run --prefix frontend/admin typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "npm run --prefix frontend/admin build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    }
  ],
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright logs in as tenant-admin-acme, renders the seeded live QA052 skill lifecycle installation, clicks Save reference, verifies the backend mutation result, and captures a screenshot. Post-UI verification must run scripts/qa/verify_skill_lifecycle_qa052.py against multi_agent_platform_qa052 to prove the credential readiness row and installation credential_status were persisted.",
    "post_ui_database_check": "uv run python scripts/qa/verify_skill_lifecycle_qa052.py",
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
