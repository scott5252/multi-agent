{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 051 - Governance React Live Data",
    "spec_number": "051",
    "spec_slug": "governance-react-live-data",
    "feature_dir": "specs/051-governance-react-live-data",
    "autopilot_dir": "specs/_autopilot/remove-mock-data-roadmap/051-governance-react-live-data",
    "branch": "codex/051-governance-react-live-data",
    "qa_id": "qa051",
    "qa_label": "QA051",
    "qa_database": "multi_agent_platform_qa051",
    "qa_env_file": "specs/051-governance-react-live-data/.env.qa051",
    "artifact_root": ".data/qa051-artifacts",
    "playwright_output_dir": "output/playwright/qa051_ui",
    "manual_qa_user_guide": "specs/051-governance-react-live-data/qa051_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa051-after-spec"
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f ${qa_env_file} && cp ${qa_env_file} .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists ${qa_database} && createdb -U postgres ${qa_database}'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "seed-governance-live-data",
      "command": "uv run python scripts/qa/seed_governance_qa051.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120,
      "expect_contains": "Seeded QA051 governance prompt"
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p ${artifact_root} ${playwright_output_dir}",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "governance-platform-bootstrap-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: platform-admin' http://127.0.0.1:8000/admin/app/governance/bootstrap.json",
      "expect_exit_code": 0,
      "expect_contains": [
        "QA051 Governance Prompt",
        "Governance records"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "raw prompt text",
        "raw completion text"
      ]
    },
    {
      "id": "governance-prompts-seeded",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' http://127.0.0.1:8000/admin/app/governance/prompts.json",
      "expect_exit_code": 0,
      "expect_contains": [
        "QA051 Governance Prompt",
        "Prompt library records"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "raw prompt text",
        "raw completion text"
      ]
    },
    {
      "id": "governance-cross-tenant-empty",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-globex' http://127.0.0.1:8000/admin/app/governance/bootstrap.json",
      "expect_exit_code": 0,
      "expect_contains": "No governance records found",
      "expect_not_contains": "QA051 Governance Prompt"
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa051-live-data-ui-api-smoke",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/governance"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"platform-admin\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Governance"
          },
          {
            "expect_text": "QA051 Governance Prompt"
          },
          {
            "click": "button:has-text(\"Save summary\")"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Prompt draft summary saved"
          },
          {
            "click": "button:has-text(\"Preview redaction check\")"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Protected prompt content is summarized."
          },
          {
            "screenshot": "qa051-live-data-ui-api-smoke.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "post_spec_validation": {
    "playwright_database_requirement": "Playwright logs in as platform-admin, renders the seeded live QA051 prompt, clicks Save summary, verifies the backend mutation result, then runs a redaction-check preview. Post-UI verification must run scripts/qa/verify_governance_qa051.py against multi_agent_platform_qa051 to prove the prompt draft revision advanced and the saved safe-summary metadata persisted.",
    "post_ui_database_check": "uv run python scripts/qa/verify_governance_qa051.py",
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
