{
  "extends": "../shared/validation.base.yml",
  "variables": {
    "spec_title": "Operations Console Logs And Performance",
    "spec_number": "019",
    "spec_slug": "operations-console-logs-performance",
    "feature_dir": "specs/019-operations-console-logs-performance",
    "autopilot_dir": "specs/_autopilot/019-operations-console-logs-performance",
    "branch": "codex/019-operations-console-logs-performance",
    "qa_id": "qa019",
    "qa_label": "QA019",
    "qa_database": "multi_agent_platform_qa019",
    "qa_env_file": "specs/019-operations-console-logs-performance/.env.qa019",
    "artifact_root": ".data/qa019-artifacts",
    "playwright_output_dir": "output/playwright/qa019_ui",
    "manual_qa_user_guide": "specs/019-operations-console-logs-performance/qa019_user_guide.md"
  },
  "playwright": {
    "flows": [
      {
        "id": "operations-console-logs-performance-ui-login",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/operations"
          },
          {
            "expect_text": "Local Login"
          },
          {
            "screenshot": "01-local-login.png",
            "full_page": true
          },
          {
            "click": "article:has-text(\"platform-admin\") button"
          },
          {
            "expect_text": "Operations Console"
          },
          {
            "screenshot": "02-operations-console-logs-performance-target.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "operations-console-logs-performance-ui-target",
        "steps": [
          {
            "goto": "/admin/operations"
          },
          {
            "expect_text": "Operations Console"
          },
          {
            "screenshot": "03-operations-console-logs-performance-direct-target.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "extra_commands": [
    {
      "id": "seed-qa-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d ${qa_database} -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING;\"",
      "expect_exit_code": 0
    },
    {
      "id": "operations-dashboard",
      "command": "curl --fail --silent -H 'X-Local-Principal: platform-admin' http://127.0.0.1:8000/admin/operations/api/dashboard | tee /tmp/qa019-dashboard.json",
      "expect_exit_code": 0,
      "expect_contains": ["redaction_notice", "status_cards"],
      "expect_not_contains": ["qa019-fake-token", "Authorization", "raw prompt"]
    },
    {
      "id": "operations-logs",
      "command": "curl --fail --silent -H 'X-Local-Principal: auditor' 'http://127.0.0.1:8000/admin/operations/api/logs?limit=25' | tee /tmp/qa019-logs.json",
      "expect_exit_code": 0,
      "expect_contains": ["items", "filters"],
      "expect_not_contains": ["qa019-fake-token", "Authorization", "raw prompt"]
    },
    {
      "id": "operations-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa019-tenant-denied.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' http://127.0.0.1:8000/admin/operations/api/dashboard)\" = \"403\"",
      "expect_exit_code": 0
    },
    {
      "id": "operations-export",
      "command": "curl --fail --silent -X POST -H 'X-Local-Principal: platform-admin' -H 'Content-Type: application/json' http://127.0.0.1:8000/admin/operations/api/logs/export -d '{\"filters\":{\"limit\":25}}' | tee /tmp/qa019-export.json",
      "expect_exit_code": 0,
      "expect_contains": ["export_id", "artifact_uri", "artifact_sha256"],
      "expect_not_contains": ["qa019-fake-token", "Authorization", "raw prompt"]
    }
  ]
}
