  "playwright_pre_commands": [
    {
      "id": "seed-workflow-test-evidence",
      "command": "uv run python scripts/qa/seed_workflow_test_evidence_qa072.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    }
  ],
  "extra_commands": [
    {
      "id": "seed-workflow-test-evidence",
      "command": "uv run python scripts/qa/seed_workflow_test_evidence_qa072.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "workflow-builder-current-evidence",
      "command": "curl --fail --silent -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/workflows/drafts/72727272-6669-4672-8672-000000000072/detail.json?tenant_id=11111111-1111-1111-1111-111111111111' | jq -e '.draft.document.test_requirements[0].latest_result_status == \"passed\" and .publish_readiness.required_evidence[0].status == \"ready\"'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "workflow-builder-cross-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa072-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-globex' 'http://127.0.0.1:8000/admin/app/workflows/drafts/72727272-6669-4672-8672-000000000072/detail.json?tenant_id=22222222-2222-2222-2222-222222222222')\" = \"403\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-react-types-fresh",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "frontend-install-deps",
      "command": "cd frontend/admin && npm ci",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-typecheck",
      "command": "cd frontend/admin && npm run typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-vitest",
      "command": "cd frontend/admin && npm test",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-build",
      "command": "cd frontend/admin && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    }
  ],
  "post_spec_validation": {
    "curl_testing": {
      "file": "curl_testing.md",
      "require_update_when_public_api_changes": true,
      "require_commands_for_new_route_families": true,
      "evidence_note": "Record the curl_testing.md sections covering new or changed workflow setup APIs in this spec's status.json."
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "if ! docker info >/dev/null 2>&1; then command -v open >/dev/null 2>&1 && open -a Docker || true; for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 5; done; fi; docker info >/dev/null && docker compose up -d postgres && uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
