          {
            "expect_text": "Required deterministic evidence is passing for the current workflow revision."
          },
          {
            "expect_text": "Required test evidence"
          },
          {
            "click": "button:has-text(\"Add safe case\")"
          },
          {
            "expect_text": "Case result"
          },
          {
            "click": "button:has-text(\"Launch deterministic run\")"
