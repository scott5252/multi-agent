{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 068 - Durable Agent Interaction Evidence And Replay Graph",
    "spec_number": "068",
    "spec_slug": "durable-agent-interaction-evidence-and-replay-graph",
    "feature_dir": "specs/068-durable-agent-interaction-evidence-and-replay-graph",
    "autopilot_dir": "specs/_autopilot/graphical-ui-roadmap/068-durable-agent-interaction-evidence-and-replay-graph",
    "branch": "codex/068-durable-agent-interaction-evidence-and-replay-graph",
    "qa_id": "qa068",
    "qa_label": "QA068",
    "qa_database": "multi_agent_platform_qa068",
    "qa_env_file": "specs/068-durable-agent-interaction-evidence-and-replay-graph/.env.qa068",
    "artifact_root": ".data/qa068-artifacts",
    "playwright_output_dir": "output/playwright/qa068_ui",
    "manual_qa_user_guide": "specs/068-durable-agent-interaction-evidence-and-replay-graph/qa068_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa068-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa068-interaction-replay-graph-desktop",
        "steps": [
          {
            "viewport": {
              "width": 1440,
              "height": 1000
            }
          },
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/operations%3Frun_id%3D68686868-6666-4868-8868-000000000068%26tenant_id%3D11111111-1111-1111-1111-111111111111"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value=\"tenant-admin-acme\"]) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Runtime run communication"
          },
          {
            "expect_text": "retry_scheduled"
          },
          {
            "click": "section[aria-labelledby=\"agent-node-list-title\"] button:has-text(\"Specialist\")"
          },
          {
            "expect_text": "Specialist is retry scheduled"
          },
          {
            "click": "section[aria-labelledby=\"agent-edge-list-title\"] button:has-text(\"delegates to\")"
          },
          {
            "expect_text": "Replay 1: handoff"
          },
          {
            "expect_text": "Coordinator sent safe context to Specialist."
          },
          {
            "screenshot": "qa068-interaction-replay-graph-desktop.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa068-interaction-replay-graph-mobile",
        "steps": [
          {
            "viewport": {
              "width": 390,
              "height": 900
            }
          },
          {
            "goto": "/admin/app/operations?run_id=68686868-6666-4868-8868-000000000068&tenant_id=11111111-1111-1111-1111-111111111111"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "Runtime run communication"
          },
          {
            "expect_text": "paused"
          },
          {
            "click": "section[aria-labelledby=\"agent-edge-list-title\"] button:has-text(\"delegates to\")"
          },
          {
            "expect_text": "Replay 1: handoff"
          },
          {
            "screenshot": "qa068-interaction-replay-graph-mobile.png",
            "full_page": true
          }
        ]
      }
    ]
  },
  "playwright_pre_commands": [
    {
      "id": "seed-qa068-interaction-replay-graph",
      "command": "uv run python scripts/qa/seed_runtime_interaction_evidence_qa068.py",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    }
  ],
  "extra_quality_commands": [
    {
      "id": "generated-react-types-fresh",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "frontend-install-deps",
      "command": "cd frontend/admin && npm ci",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-typecheck",
      "command": "cd frontend/admin && npm run typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-vitest",
      "command": "cd frontend/admin && npm test",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-build",
      "command": "cd frontend/admin && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    }
  ],
  "post_spec_validation": {
    "curl_testing": {
      "file": "curl_testing.md",
      "require_update_when_public_api_changes": true,
      "require_commands_for_new_route_families": true,
      "evidence_note": "Record the curl_testing.md sections covering new or changed graphical agent workflow APIs in this spec's status.json."
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "if ! docker info >/dev/null 2>&1; then command -v open >/dev/null 2>&1 && open -a Docker || true; for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 5; done; fi; docker info >/dev/null && docker compose up -d postgres && uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
