{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 065 - Agent Communication Graph Contracts And Projections",
    "spec_number": "065",
    "spec_slug": "agent-communication-graph-contracts-and-projections",
    "feature_dir": "specs/065-agent-communication-graph-contracts-and-projections",
    "autopilot_dir": "specs/_autopilot/graphical-ui-roadmap/065-agent-communication-graph-contracts-and-projections",
    "branch": "codex/065-agent-communication-graph-contracts-and-projections",
    "qa_id": "qa065",
    "qa_label": "QA065",
    "qa_database": "multi_agent_platform_qa065",
    "qa_env_file": "specs/065-agent-communication-graph-contracts-and-projections/.env.qa065",
    "artifact_root": ".data/qa065-artifacts",
    "playwright_output_dir": "output/playwright/qa065_ui",
    "manual_qa_user_guide": "specs/065-agent-communication-graph-contracts-and-projections/qa065_user_guide.md",
    "curl_test_output_dir": ".data/curl_test_runs/qa065-after-spec"
  },
  "playwright": {
    "flows": [
      {
        "id": "qa065-graphical-ui-smoke",
        "steps": [
          {
            "goto": "/openapi.json"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "agent"
          },
          {
            "screenshot": "qa065-graphical-ui-smoke.png",
            "full_page": false
          }
        ]
      }
    ]
  },
  "extra_quality_commands": [
    {
      "id": "generated-react-types-fresh",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "frontend-install-deps",
      "command": "cd frontend/admin && npm ci",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-typecheck",
      "command": "cd frontend/admin && npm run typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-vitest",
      "command": "cd frontend/admin && npm test",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "frontend-build",
      "command": "cd frontend/admin && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    }
  ],
  "post_spec_validation": {
    "curl_testing": {
      "file": "curl_testing.md",
      "require_update_when_public_api_changes": true,
      "require_commands_for_new_route_families": true,
      "evidence_note": "Record the curl_testing.md sections covering new or changed graphical agent workflow APIs in this spec's status.json."
    },
    "curl_test": {
      "skill": "multi-agent-curl-test",
      "database": "multi_agent_curl_test",
      "command": "if ! docker info >/dev/null 2>&1; then command -v open >/dev/null 2>&1 && open -a Docker || true; for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 5; done; fi; docker info >/dev/null && docker compose up -d postgres && uv run python .agents/skills/multi-agent-curl-test/scripts/run_curl_test.py --output-dir ${curl_test_output_dir}"
    }
  }
}
