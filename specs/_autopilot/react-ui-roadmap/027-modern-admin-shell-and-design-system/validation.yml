{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 027 - Modern Admin Shell And Design System",
    "spec_number": "027",
    "spec_slug": "modern-admin-shell-and-design-system",
    "feature_dir": "specs/027-modern-admin-shell-and-design-system",
    "autopilot_dir": "specs/_autopilot/react-ui-roadmap/027-modern-admin-shell-and-design-system",
    "branch": "codex/027-modern-admin-shell-and-design-system",
    "qa_id": "qa027",
    "qa_label": "QA027",
    "qa_database": "multi_agent_platform_qa027",
    "qa_env_file": "specs/027-modern-admin-shell-and-design-system/.env.qa027",
    "artifact_root": ".data/qa027-artifacts",
    "playwright_output_dir": "output/playwright/qa027_ui",
    "manual_qa_user_guide": "specs/027-modern-admin-shell-and-design-system/qa027_user_guide.md"
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f specs/027-modern-admin-shell-and-design-system/.env.qa027 && cp specs/027-modern-admin-shell-and-design-system/.env.qa027 .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "build-react-admin-assets",
      "command": "cd frontend/admin && npm install && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa027 && createdb -U postgres multi_agent_platform_qa027'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa027 -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p .data/qa027-artifacts output/playwright/qa027_ui",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "react-shell-bootstrap-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"label\":\"Acme\"",
        "\"react_admin_enabled\":true",
        "\"api_version\":\"qa027\"",
        "\"design_token_version\":\"qa027\"",
        "\"search_url\"",
        "Existing console"
      ],
      "expect_not_contains": [
        "qa027-secret-value",
        "raw-jti",
        "/Users/"
      ]
    },
    {
      "id": "react-shell-search-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/search.json?tenant_id=11111111-1111-1111-1111-111111111111&q=workflow'",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"query\":\"workflow\"",
        "Workflow Registry",
        "Open Workflows"
      ],
      "expect_not_contains": [
        "Globex",
        "qa027-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-shell-search-empty",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/search.json?tenant_id=11111111-1111-1111-1111-111111111111&q=zz-no-match'",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"results\":[]"
      ],
      "expect_not_contains": [
        "Globex",
        "qa027-secret-value"
      ]
    },
    {
      "id": "react-config-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' http://127.0.0.1:8000/admin/app/config.json",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"mount_path\":\"/admin/app\"",
        "\"asset_base_path\":\"/admin/static/react\""
      ]
    },
    {
      "id": "react-manifest-safe-summary",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' http://127.0.0.1:8000/admin/app/manifest.json",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"base_path\":\"/admin/static/react\"",
        "\"entrypoints\""
      ],
      "expect_not_contains": [
        "/Users/",
        "frontend/admin"
      ]
    },
    {
      "id": "react-shell-denied-fails-closed",
      "command": "test \"$(curl --silent --output /tmp/qa027-denied.html --write-out '%{http_code}' http://127.0.0.1:8000/admin/app)\" = \"401\" && rg -q 'missing local principal header or cookie' /tmp/qa027-denied.html",
      "expect_exit_code": 0
    },
    {
      "id": "react-shell-search-denied-fails-closed",
      "command": "test \"$(curl --silent --output /tmp/qa027-search-denied.json --write-out '%{http_code}' 'http://127.0.0.1:8000/admin/app/search.json?q=workflow')\" = \"401\" && ! rg -q 'Workflow Registry' /tmp/qa027-search-denied.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-shell-cross-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa027-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222')\" = \"403\" && ! rg -q 'Globex' /tmp/qa027-cross-tenant.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-shell-search-cross-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa027-search-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/search.json?tenant_id=22222222-2222-2222-2222-222222222222&q=workflow')\" = \"403\" && ! rg -q 'Globex' /tmp/qa027-search-cross-tenant.json",
      "expect_exit_code": 0
    }
  ],
  "extra_quality_commands": [
    {
      "id": "qa-documents",
      "command": "bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/027-modern-admin-shell-and-design-system",
      "expect_exit_code": 0
    },
    {
      "id": "frontend-typecheck",
      "command": "cd frontend/admin && npm run typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-tests",
      "command": "cd frontend/admin && npm run test",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "cd frontend/admin && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "generated-react-contracts",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa027-react-shell-denied",
        "steps": [
          {
            "goto": "/admin/app"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "missing local principal header or cookie"
          },
          {
            "screenshot": "qa027-react-shell-denied.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa027-react-shell-login",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='tenant-admin-acme']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "React Admin"
          },
          {
            "expect_text": "Acme"
          },
          {
            "expect_text": "Existing console"
          },
          {
            "expect_text": "Saved filters"
          },
          {
            "expect_text": "Command"
          },
          {
            "screenshot": "qa027-react-shell-authenticated.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa027-react-shell-search",
        "steps": [
          {
            "goto": "/admin/app"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "fill": {
              "selector": "input[aria-label='Search authorized admin destinations']",
              "value": "workflow"
            }
          },
          {
            "expect_text": "Workflow Registry"
          },
          {
            "expect_text": "Open Workflows"
          },
          {
            "screenshot": "qa027-react-shell-search.png",
            "full_page": true
          }
        ]
      }
    ]
  }
}
