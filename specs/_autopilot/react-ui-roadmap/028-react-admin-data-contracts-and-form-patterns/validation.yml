{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 028 - React Admin Data Contracts And Form Patterns",
    "spec_number": "028",
    "spec_slug": "react-admin-data-contracts-and-form-patterns",
    "feature_dir": "specs/028-react-admin-data-contracts-and-form-patterns",
    "autopilot_dir": "specs/_autopilot/react-ui-roadmap/028-react-admin-data-contracts-and-form-patterns",
    "branch": "codex/028-react-admin-data-contracts-and-form-patterns",
    "qa_id": "qa028",
    "qa_label": "QA028",
    "qa_database": "multi_agent_platform_qa028",
    "qa_env_file": "specs/028-react-admin-data-contracts-and-form-patterns/.env.qa028",
    "artifact_root": ".data/qa028-artifacts",
    "playwright_output_dir": "output/playwright/qa028_ui",
    "manual_qa_user_guide": "specs/028-react-admin-data-contracts-and-form-patterns/qa028_user_guide.md"
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f specs/028-react-admin-data-contracts-and-form-patterns/.env.qa028 && cp specs/028-react-admin-data-contracts-and-form-patterns/.env.qa028 .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "build-react-admin-assets",
      "command": "cd frontend/admin && npm install && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa028 && createdb -U postgres multi_agent_platform_qa028'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa028 -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p .data/qa028-artifacts output/playwright/qa028_ui",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "react-patterns-shell-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "React Admin",
        "/admin/app/bootstrap.json"
      ],
      "expect_not_contains": [
        "qa028-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-patterns-envelope-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Forms and data patterns",
        "Workflow readiness review",
        "artifact-ref-qa028-tenant",
        "sample-submit",
        "sample-export"
      ],
      "expect_not_contains": [
        "qa028-secret-value",
        "/Users/",
        "Globex"
      ]
    },
    {
      "id": "react-patterns-filtered-envelope",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns.json?tenant_id=11111111-1111-1111-1111-111111111111&status=ready'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Status: ready",
        "Workflow readiness review"
      ],
      "expect_not_contains": [
        "Globex",
        "qa028-secret-value"
      ]
    },
    {
      "id": "react-patterns-bad-filter-safe-problem",
      "command": "test \"$(curl --silent --output /tmp/qa028-patterns-bad-filter.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns.json?tenant_id=11111111-1111-1111-1111-111111111111&status=raw-secret')\" = \"400\" && rg -q 'validation_error' /tmp/qa028-patterns-bad-filter.json && ! rg -q 'qa028-secret-value|/Users/' /tmp/qa028-patterns-bad-filter.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-patterns-bad-sort-safe-problem",
      "command": "test \"$(curl --silent --output /tmp/qa028-patterns-bad-sort.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns.json?tenant_id=11111111-1111-1111-1111-111111111111&sort=raw-secret')\" = \"400\" && rg -q 'validation_error' /tmp/qa028-patterns-bad-sort.json && ! rg -q 'qa028-secret-value|/Users/' /tmp/qa028-patterns-bad-sort.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-patterns-mutation-validation",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns/actions/sample?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"sample_name\":\"\",\"revision\":\"sample-revision-current\",\"idempotency_key\":\"qa028-validation\",\"confirmed\":false,\"outcome\":\"accepted\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "validation_error",
        "sample_name",
        "Enter a sample name."
      ],
      "expect_not_contains": [
        "qa028-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-patterns-mutation-stale",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns/actions/sample?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"sample_name\":\"Preview\",\"revision\":\"stale-revision\",\"idempotency_key\":\"qa028-stale\",\"confirmed\":false,\"outcome\":\"stale\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "stale_conflict",
        "sample-revision-current",
        "The sample has a newer safe revision."
      ],
      "expect_not_contains": [
        "qa028-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-patterns-mutation-replay",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns/actions/sample?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"sample_name\":\"Preview\",\"revision\":\"sample-revision-current\",\"idempotency_key\":\"replay-key\",\"confirmed\":false,\"outcome\":\"replay\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "replayed",
        "No duplicate side effect"
      ],
      "expect_not_contains": [
        "qa028-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-patterns-mutation-confirmation",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns/actions/sample?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"sample_name\":\"Preview\",\"revision\":\"sample-revision-current\",\"idempotency_key\":\"qa028-confirm\",\"confirmed\":false,\"outcome\":\"confirmation\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "confirmation_required",
        "Confirm preview"
      ],
      "expect_not_contains": [
        "qa028-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-patterns-export-safe-reference",
      "command": "curl --fail --silent --show-error -X POST -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns/export?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "complete",
        "artifact-ref-qa028-tenant",
        "audit-export-qa028-tenant"
      ],
      "expect_not_contains": [
        "/Users/",
        "qa028-secret-value"
      ]
    },
    {
      "id": "react-patterns-denied-fails-closed",
      "command": "test \"$(curl --silent --output /tmp/qa028-patterns-denied.html --write-out '%{http_code}' http://127.0.0.1:8000/admin/app/patterns)\" = \"401\" && rg -q 'missing local principal header or cookie' /tmp/qa028-patterns-denied.html && ! rg -q 'Workflow readiness review|artifact-ref-qa028' /tmp/qa028-patterns-denied.html",
      "expect_exit_code": 0
    },
    {
      "id": "react-patterns-envelope-cross-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa028-patterns-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/patterns.json?tenant_id=22222222-2222-2222-2222-222222222222')\" = \"403\" && ! rg -q 'Globex|Workflow readiness review|artifact-ref-qa028' /tmp/qa028-patterns-cross-tenant.json",
      "expect_exit_code": 0
    }
  ],
  "extra_quality_commands": [
    {
      "id": "qa-documents",
      "command": "bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/028-react-admin-data-contracts-and-form-patterns",
      "expect_exit_code": 0
    },
    {
      "id": "frontend-typecheck",
      "command": "cd frontend/admin && npm run typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-tests",
      "command": "cd frontend/admin && npm run test",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "cd frontend/admin && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "generated-react-contracts",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa028-react-patterns-denied",
        "steps": [
          {
            "goto": "/admin/app/patterns"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "missing local principal header or cookie"
          },
          {
            "screenshot": "qa028-react-patterns-denied.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa028-react-patterns-page",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/patterns"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='tenant-admin-acme']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "React Admin"
          },
          {
            "expect_text": "Forms and data patterns"
          },
          {
            "expect_text": "Workflow readiness review"
          },
          {
            "expect_text": "Sample action"
          },
          {
            "expect_text": "artifact-ref-qa028-tenant"
          },
          {
            "screenshot": "qa028-react-patterns-page.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa028-react-patterns-validation",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/patterns"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='tenant-admin-acme']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "button:has-text('Preview result')"
          },
          {
            "expect_text": "validation error"
          },
          {
            "expect_text": "Enter a sample name."
          },
          {
            "screenshot": "qa028-react-patterns-validation.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa028-react-patterns-stale",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/patterns"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='tenant-admin-acme']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "fill": {
              "selector": "label:has-text('Sample name') input",
              "value": "Preview"
            }
          },
          {
            "fill": {
              "selector": "label:has-text('Outcome') input",
              "value": "stale"
            }
          },
          {
            "click": "button:has-text('Preview result')"
          },
          {
            "expect_text": "stale conflict"
          },
          {
            "expect_text": "The sample has a newer safe revision."
          },
          {
            "screenshot": "qa028-react-patterns-stale.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa028-react-patterns-export",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/patterns"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='tenant-admin-acme']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "button:has-text('Export preview')"
          },
          {
            "expect_text": "Sample export snapshot is ready as a safe artifact reference."
          },
          {
            "expect_text": "artifact-ref-qa028-tenant"
          },
          {
            "screenshot": "qa028-react-patterns-export.png",
            "full_page": true
          }
        ]
      }
    ]
  }
}
