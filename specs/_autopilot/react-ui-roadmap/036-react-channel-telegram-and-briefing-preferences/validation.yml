extra_quality_commands:
  - id: qa-docs
    command: bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/036-react-channel-telegram-and-briefing-preferences
    expect_exit_code: 0
  - id: frontend-typecheck-test-build
    command: cd frontend/admin && npm run typecheck && npm run test && npm run build
    expect_exit_code: 0
    timeout_seconds: 300
  - id: generated-react-types-check
    command: uv run python scripts/frontend/generate_admin_react_types.py --check
    expect_exit_code: 0
  - id: focused-channel-telegram-briefing-pytest
    command: uv run pytest --no-cov tests/unit/api/test_admin_channel_telegram_briefing_react_schema.py tests/unit/admin/channel_telegram_briefing/test_react_channel_telegram_briefing_service.py tests/performance/channel_telegram_briefing/test_react_channel_telegram_briefing_queries.py tests/contract/test_admin_react_contract.py tests/integration/test_admin_react_routes.py
    expect_exit_code: 0
    timeout_seconds: 300
  - id: qa036-redaction-scan
    command: >-
      ! rg -n "qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label" /tmp/qa036-* output/playwright/qa036_ui
    expect_exit_code: 0
playwright:
  base_url: http://127.0.0.1:8000
  output_dir: output/playwright/qa036_ui
  flows:
    - id: qa036-react-channels-denied
      steps:
        - goto: /admin/app/channels
        - wait_for_load_state: networkidle
        - screenshot: qa036-react-channels-denied.png
          full_page: true
    - id: qa036-react-channels-platform
      steps:
        - goto: /auth/local-login?redirect_to=/admin/app/channels
        - wait_for_load_state: networkidle
        - click: form:has(input[value="platform-admin"]) button
        - wait_for_load_state: networkidle
        - goto: /admin/app/channels
        - wait_for_load_state: networkidle
        - expect_text: Channel, Telegram, and Briefing Preferences
        - expect_text: Telegram provider ref ready
        - expect_text: Readiness
        - screenshot: qa036-react-channels-platform.png
          full_page: true
    - id: qa036-react-channels-admin-actions
      steps:
        - click: button:has-text("Validate Acme")
        - expect_text: local mock-safe evidence
        - click: button:has-text("Create Alias")
        - expect_text: Alias saved with protected readiness
        - screenshot: qa036-react-channels-admin-actions.png
          full_page: true
    - id: qa036-react-channels-run-status
      steps:
        - click: button:has-text("Open Run Status") >> nth=0
        - wait_for_load_state: networkidle
        - expect_text: Daily briefing workflow
        - expect_text: artifact-ref-qa036-safe-status
        - screenshot: qa036-react-channels-run-status.png
          full_page: true
    - id: qa036-react-channels-tenant-admin
      steps:
        - goto: /auth/local-login?redirect_to=/admin/app/channels?tenant_id=11111111-1111-1111-1111-111111111111
        - wait_for_load_state: networkidle
        - click: form:has(input[value="tenant-admin-acme"]) button
        - wait_for_load_state: networkidle
        - expect_text: Channel, Telegram, and Briefing Preferences
        - expect_text: Acme
        - expect_text: Morning briefing
        - screenshot: qa036-react-channels-tenant-admin.png
          full_page: true
    - id: qa036-react-channels-preferences
      steps:
        - click: button:has-text("Save Preferences")
        - expect_text: Preference profile saved with redacted summaries
        - click: button:has-text("Import")
        - expect_text: Preference import accepted
        - click: button:has-text("Export")
        - expect_text: preference-export-artifact-qa036
        - screenshot: qa036-react-channels-preferences.png
          full_page: true
    - id: qa036-react-channels-tenant-user
      steps:
        - goto: /auth/local-login?redirect_to=/admin/app/channels?tenant_id=11111111-1111-1111-1111-111111111111
        - wait_for_load_state: networkidle
        - click: form:has(input[value="tenant-user-acme"]) button
        - wait_for_load_state: networkidle
        - expect_text: America/New_York
        - expect_text: Save Preferences
        - screenshot: qa036-react-channels-tenant-user.png
          full_page: true
