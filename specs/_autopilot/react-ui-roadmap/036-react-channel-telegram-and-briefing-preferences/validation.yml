      status="$(curl --silent --show-error --output /tmp/qa036-cross-tenant-denied.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222')" && test "$status" = "403" && ! rg -q 'Globex|qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/' /tmp/qa036-cross-tenant-denied.json
    expect_exit_code: 0
  - id: react-channels-config-save
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/telegram/config?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"enabled":true,"bot_token_reference_label":"Telegram provider ref ready","webhook_signing_reference_label":"Webhook signing ref ready","revision":"telegram-config-rev-qa036","idempotency_key":"qa036-config-save"}' > /tmp/qa036-config-save.json && rg -q 'accepted' /tmp/qa036-config-save.json && rg -q 'audit-qa036-telegram-config-save' /tmp/qa036-config-save.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-config-save.json
    expect_exit_code: 0
  - id: react-channels-webhook-validate
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/telegram/webhook/validate?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"tenant_id":"11111111-1111-1111-1111-111111111111","revision":"telegram-config-rev-qa036","idempotency_key":"qa036-webhook"}' > /tmp/qa036-webhook-validate.json && rg -q 'accepted' /tmp/qa036-webhook-validate.json && rg -q 'local mock-safe evidence' /tmp/qa036-webhook-validate.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-webhook-validate.json
    expect_exit_code: 0
  - id: react-channels-alias-save
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/telegram/aliases?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"alias_id":null,"alias_text":"Morning briefing","target_summary":"Daily briefing workflow","revision":null,"idempotency_key":"qa036-alias-create"}' > /tmp/qa036-alias-save.json && rg -q 'accepted' /tmp/qa036-alias-save.json && rg -q 'audit-qa036-alias-save' /tmp/qa036-alias-save.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-alias-save.json
    expect_exit_code: 0
  - id: react-channels-alias-refresh
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/telegram/aliases/alias-morning-qa036/refresh?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"revision":"alias-rev-qa036","idempotency_key":"qa036-alias-refresh"}' > /tmp/qa036-alias-refresh.json && rg -q 'audit-qa036-alias-refresh' /tmp/qa036-alias-refresh.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-alias-refresh.json
    expect_exit_code: 0
  - id: react-channels-link-token-create-sanitized
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/telegram/link-tokens?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"principal_label":"Acme briefing user","expires_in_minutes":10,"idempotency_key":"qa036-link-token"}' | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const p = JSON.parse(s); if (p.token_value) p.token_value = "[visible-once-redacted-in-evidence]"; console.log(JSON.stringify(p)); });' > /tmp/qa036-link-token.json && rg -q 'visible-once-redacted-in-evidence' /tmp/qa036-link-token.json && ! rg -q 'pair-code|qa036-secret-value|bot token|webhook secret|full telegram|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-link-token.json
    expect_exit_code: 0
  - id: react-channels-deliveries
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/telegram/deliveries.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa036-deliveries.json && rg -q 'delivery-acme-qa036' /tmp/qa036-deliveries.json && rg -q 'mocked' /tmp/qa036-deliveries.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-deliveries.json
