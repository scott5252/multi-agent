extends: ../../shared/validation.base.yml
variables:
  spec_title: Spec 036 - React Channel, Telegram, And Briefing Preferences
  spec_number: "036"
  spec_slug: react-channel-telegram-and-briefing-preferences
  feature_dir: specs/036-react-channel-telegram-and-briefing-preferences
  autopilot_dir: specs/_autopilot/react-ui-roadmap/036-react-channel-telegram-and-briefing-preferences
  branch: codex/036-react-channel-telegram-and-briefing-preferences
  qa_id: qa036
  qa_label: QA036
  qa_database: multi_agent_platform_qa036
  qa_env_file: specs/036-react-channel-telegram-and-briefing-preferences/.env.qa036
  artifact_root: .data/qa036-artifacts
  playwright_output_dir: output/playwright/qa036_ui
  manual_qa_user_guide: specs/036-react-channel-telegram-and-briefing-preferences/qa036_user_guide.md
setup_commands:
  - id: backup-env
    command: test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup
    expect_exit_code: 0
  - id: copy-qa-env
    command: test -f specs/036-react-channel-telegram-and-briefing-preferences/.env.qa036 && cp specs/036-react-channel-telegram-and-briefing-preferences/.env.qa036 .env
    expect_exit_code: 0
  - id: install-deps
    command: uv sync
    expect_exit_code: 0
    timeout_seconds: 300
  - id: build-react-admin-assets
    command: cd frontend/admin && npm install && npm run build
    expect_exit_code: 0
    timeout_seconds: 300
  - id: start-postgres
    command: docker compose up -d postgres
    expect_exit_code: 0
    timeout_seconds: 120
  - id: reset-qa-db
    command: docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa036 && createdb -U postgres multi_agent_platform_qa036'
    expect_exit_code: 0
    timeout_seconds: 120
  - id: migrate-db
    command: uv run alembic upgrade head
    expect_exit_code: 0
    timeout_seconds: 180
  - id: seed-local-tenants
    command: >-
      docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa036 -v ON_ERROR_STOP=1 -c "INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING"
    expect_exit_code: 0
    timeout_seconds: 120
  - id: create-artifact-root
    command: mkdir -p .data/qa036-artifacts output/playwright/qa036_ui
    expect_exit_code: 0
extra_commands:
  - id: react-channels-shell-authenticated
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/channels' > /tmp/qa036-channel-shell.html && rg -q 'React Admin' /tmp/qa036-channel-shell.html && rg -q '/admin/app/channels/shell.json' /tmp/qa036-channel-shell.html && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-channel-shell.html
    expect_exit_code: 0
  - id: react-channels-platform-dashboard
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/channels/bootstrap.json' > /tmp/qa036-platform-channels.json && rg -q 'Channel, Telegram, and Briefing Preferences' /tmp/qa036-platform-channels.json && rg -q 'Acme' /tmp/qa036-platform-channels.json && rg -q 'Globex' /tmp/qa036-platform-channels.json && rg -q 'Telegram provider ref ready' /tmp/qa036-platform-channels.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-platform-channels.json
    expect_exit_code: 0
  - id: react-channels-tenant-dashboard
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa036-tenant-channels.json && rg -q 'Acme' /tmp/qa036-tenant-channels.json && rg -q 'Morning briefing' /tmp/qa036-tenant-channels.json && rg -q 'Telegram user tg-\*\*\*-1842' /tmp/qa036-tenant-channels.json && ! rg -q 'Globex|qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-tenant-channels.json
    expect_exit_code: 0
  - id: react-channels-tenant-user-dashboard
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-user-acme' 'http://127.0.0.1:8000/admin/app/channels/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa036-tenant-user-channels.json && rg -q 'briefing-profile-current-qa036' /tmp/qa036-tenant-user-channels.json && ! rg -q 'alias-morning-qa036|Globex|qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-tenant-user-channels.json
