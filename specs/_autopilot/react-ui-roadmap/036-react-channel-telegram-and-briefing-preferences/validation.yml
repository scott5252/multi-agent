      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/channels/runs/qa036-run-morning-briefing/status.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa036-run-status.json && rg -q 'Daily briefing workflow' /tmp/qa036-run-status.json && rg -q 'artifact-ref-qa036-safe-status' /tmp/qa036-run-status.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-run-status.json
    expect_exit_code: 0
  - id: react-channels-preference-save
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-user-acme' 'http://127.0.0.1:8000/admin/app/channels/briefing/preferences?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"timezone":"America/New_York","location_summary":"Metro area summary","news_topics_summary":"4 topic categories","vip_sender_summary":"3 masked sender hints","workday_hours":"08:30-17:30","commute_mode":"transit","default_account_summary":"2 masked account refs","output_style":"executive","scheduled_time_summary":"Profile preference 07:45","revision":"briefing-pref-rev-qa036","idempotency_key":"qa036-preference-save"}' > /tmp/qa036-preferences-save.json && rg -q 'accepted' /tmp/qa036-preferences-save.json && rg -q 'briefing-pref-rev-qa036-next' /tmp/qa036-preferences-save.json && ! rg -q 'qa036-secret-value|bot token|webhook secret|full telegram|pair-code|private message|raw preference|raw prompt|run result|raw tool payload|/Users/|unauthorized tenant label' /tmp/qa036-preferences-save.json
