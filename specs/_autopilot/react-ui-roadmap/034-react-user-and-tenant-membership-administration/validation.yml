extends: ../../shared/validation.base.yml
variables:
  spec_title: Spec 034 - React User And Tenant Membership Administration
  spec_number: "034"
  spec_slug: react-user-and-tenant-membership-administration
  feature_dir: specs/034-react-user-and-tenant-membership-administration
  autopilot_dir: specs/_autopilot/react-ui-roadmap/034-react-user-and-tenant-membership-administration
  branch: codex/034-react-user-and-tenant-membership-administration
  qa_id: qa034
  qa_label: QA034
  qa_database: multi_agent_platform_qa034
  qa_env_file: specs/034-react-user-and-tenant-membership-administration/.env.qa034
  artifact_root: .data/qa034-artifacts
  playwright_output_dir: output/playwright/qa034_ui
  manual_qa_user_guide: specs/034-react-user-and-tenant-membership-administration/qa034_user_guide.md
setup_commands:
  - id: backup-env
    command: test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup
    expect_exit_code: 0
  - id: copy-qa-env
    command: test -f specs/034-react-user-and-tenant-membership-administration/.env.qa034 && cp specs/034-react-user-and-tenant-membership-administration/.env.qa034 .env
    expect_exit_code: 0
  - id: install-deps
    command: uv sync
    expect_exit_code: 0
    timeout_seconds: 300
  - id: build-react-admin-assets
    command: cd frontend/admin && npm install && npm run build
    expect_exit_code: 0
    timeout_seconds: 300
  - id: start-postgres
    command: docker compose up -d postgres
    expect_exit_code: 0
    timeout_seconds: 120
  - id: reset-qa-db
    command: docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa034 && createdb -U postgres multi_agent_platform_qa034'
    expect_exit_code: 0
    timeout_seconds: 120
  - id: migrate-db
    command: uv run alembic upgrade head
    expect_exit_code: 0
    timeout_seconds: 180
  - id: seed-local-tenants
    command: >-
      docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa034 -v ON_ERROR_STOP=1 -c "INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING"
    expect_exit_code: 0
    timeout_seconds: 120
  - id: create-artifact-root
    command: mkdir -p .data/qa034-artifacts output/playwright/qa034_ui
    expect_exit_code: 0
extra_commands:
  - id: react-memberships-shell-authenticated
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/memberships'
    expect_exit_code: 0
    expect_contains:
      - React Admin
      - /admin/app/bootstrap.json
    expect_not_contains:
      - qa034-secret-value
      - /Users/
  - id: react-memberships-platform-dashboard
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/memberships/bootstrap.json' > /tmp/qa034-platform-memberships.json && rg -q 'Membership Administration' /tmp/qa034-platform-memberships.json && rg -q 'Maya Chen' /tmp/qa034-platform-memberships.json && rg -q 'Globex' /tmp/qa034-platform-memberships.json && ! rg -q 'qa034-secret-value|raw email|full subject|authorization header|provider token|credential value|private message|/Users/|full external subject' /tmp/qa034-platform-memberships.json
    expect_exit_code: 0
  - id: react-memberships-tenant-dashboard
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/memberships/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa034-tenant-memberships.json && rg -q 'Membership Administration' /tmp/qa034-tenant-memberships.json && rg -q 'Acme' /tmp/qa034-tenant-memberships.json && rg -q 'tenant_admin' /tmp/qa034-tenant-memberships.json && ! rg -q 'Globex|platform_admin|qa034-secret-value|raw email|full subject|authorization header|provider token|credential value|private message|/Users/|full external subject' /tmp/qa034-tenant-memberships.json
    expect_exit_code: 0
  - id: react-memberships-invite-replay
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/memberships/invitations?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"email":"invite.replay@example.test","requested_roles":["tenant_user"],"tenant_id":"11111111-1111-1111-1111-111111111111","idempotency_key":"invite-ui-qa034-replay"}'
    expect_exit_code: 0
    expect_contains:
      - replayed
      - Invitation replayed with original audit evidence
      - audit-membership-qa034-invite-replayed
    expect_not_contains:
      - qa034-secret-value
      - raw email
      - full subject
      - /Users/
  - id: react-memberships-cross-tenant-invite-denied
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/memberships/invitations?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"email":"invite.safe@example.test","requested_roles":["tenant_user"],"tenant_id":"22222222-2222-2222-2222-222222222222","idempotency_key":"invite-ui-qa034-cross-tenant"}'
    expect_exit_code: 0
    expect_contains:
      - validation_error
      - Invitation scope was denied
      - audit-membership-qa034-cross-tenant-denied
    expect_not_contains:
      - Globex
      - qa034-secret-value
      - /Users/
  - id: react-memberships-principal-link
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/memberships/principals/link' -d '{"display_name":"Linked Reviewer","email":"linked.reviewer@example.test","external_subject":"auth0-safe-subject-7788","idempotency_key":"principal-link-ui-qa034","overwrite_confirmed":false,"principal_identity_id":null}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Principal identity linked with safe subject evidence
      - audit-membership-qa034-principal-linked
    expect_not_contains:
      - full subject
      - authorization header
      - qa034-secret-value
      - /Users/
  - id: react-memberships-role-grant-platform
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/memberships/role-grants' -d '{"confirmed":true,"idempotency_key":"role-grant-ui-qa034-platform","principal_identity_id":"principal-qa034-maya","role_code":"platform_admin","scope_type":"platform","tenant_id":null}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Role grant saved with backend eligibility evidence
      - audit-membership-qa034-role-granted
    expect_not_contains:
      - qa034-secret-value
      - credential value
      - /Users/
  - id: react-memberships-role-grant-tenant-denied
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/memberships/role-grants?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"confirmed":true,"idempotency_key":"role-grant-ui-qa034-denied","principal_identity_id":"principal-qa034-maya","role_code":"platform_admin","scope_type":"platform","tenant_id":null}'
    expect_exit_code: 0
    expect_contains:
      - validation_error
      - Role grant was denied
      - audit-membership-qa034-role-denied
    expect_not_contains:
      - qa034-secret-value
      - authorization header
      - /Users/
  - id: react-memberships-role-revoke
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/memberships/role-grants/grant-qa034-acme-maya/revoke' -d '{"confirmed":true,"idempotency_key":"role-revoke-ui-qa034","reason":"Admin review","revision":"membership-rev-qa034-current"}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Role grant revoked with safe audit evidence
      - audit-membership-qa034-role-revoked
    expect_not_contains:
      - qa034-secret-value
      - /Users/
  - id: react-memberships-principal-status
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/memberships/principals/principal-qa034-maya/suspend' -d '{"confirmed":true,"idempotency_key":"principal-status-ui-qa034","reason":"Admin review","revision":"membership-rev-qa034-current"}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Principal suspend action saved with audit evidence
      - audit-membership-qa034-principal-suspend
    expect_not_contains:
      - qa034-secret-value
      - raw email
      - /Users/
  - id: react-memberships-membership-status
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/memberships/memberships/membership-qa034-acme-maya/removed?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"confirmed":true,"idempotency_key":"membership-status-ui-qa034","reason":"Admin review","revision":"membership-rev-qa034-current"}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Tenant membership status saved with audit evidence
      - audit-membership-qa034-membership-status
    expect_not_contains:
      - Globex
      - qa034-secret-value
      - /Users/
  - id: react-memberships-access-history
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/memberships/access-history.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa034-access-history.json && rg -q 'role_scope_denied' /tmp/qa034-access-history.json && rg -q 'trace-membership-qa034-deny' /tmp/qa034-access-history.json && ! rg -q 'Globex|qa034-secret-value|raw email|full subject|authorization header|provider token|credential value|private message|/Users/|full external subject' /tmp/qa034-access-history.json
    expect_exit_code: 0
  - id: react-memberships-audit
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/memberships/audit.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa034-membership-audit.json && rg -q 'cross_tenant_denied' /tmp/qa034-membership-audit.json && rg -q 'safe-denial' /tmp/qa034-membership-audit.json && ! rg -q 'Globex|qa034-secret-value|raw email|full subject|authorization header|provider token|credential value|private message|/Users/|full external subject' /tmp/qa034-membership-audit.json
    expect_exit_code: 0
extra_quality_commands:
  - id: qa-docs
    command: bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/034-react-user-and-tenant-membership-administration
    expect_exit_code: 0
  - id: frontend-typecheck-test-build
    command: cd frontend/admin && npm run typecheck && npm run test && npm run build
    expect_exit_code: 0
    timeout_seconds: 300
  - id: generated-react-types-check
    command: uv run python scripts/frontend/generate_admin_react_types.py --check
    expect_exit_code: 0
  - id: focused-membership-pytest
    command: uv run pytest --no-cov tests/unit/api/test_admin_membership_react_schema.py tests/unit/admin/memberships/test_react_membership_service.py tests/performance/memberships/test_react_membership_queries.py tests/contract/test_admin_react_contract.py tests/integration/test_admin_react_routes.py
    expect_exit_code: 0
    timeout_seconds: 300
  - id: qa034-redaction-scan
    command: >-
      ! rg -n "qa034-secret-value|raw email|full subject|authorization header|provider token|credential value|private message|/Users/|unauthorized tenant label|full external subject" /tmp/qa034-* output/playwright/qa034_ui
    expect_exit_code: 0
playwright:
  base_url: http://127.0.0.1:8000
  output_dir: output/playwright/qa034_ui
  flows:
    - id: qa034-react-memberships-denied
      steps:
        - goto: /admin/app/memberships
        - wait_for_load_state: networkidle
        - screenshot: qa034-react-memberships-denied.png
          full_page: true
    - id: qa034-react-memberships-platform
      steps:
        - goto: /auth/local-login?redirect_to=/admin/app/memberships
        - wait_for_load_state: networkidle
        - click: form:has(input[value="platform-admin"]) button
        - wait_for_load_state: networkidle
        - expect_text: Membership Administration
        - expect_text: Maya Chen
        - expect_text: Jordan Lee
        - screenshot: qa034-react-memberships-platform.png
          full_page: true
    - id: qa034-react-memberships-platform-mutations
      steps:
        - click: button:has-text("Invite")
        - expect_text: Invitation replayed with original audit evidence
        - click: button:has-text("Link")
        - expect_text: Principal identity linked with safe subject evidence
        - click: button:has-text("Grant")
        - expect_text: Role grant saved with backend eligibility evidence
        - screenshot: qa034-react-memberships-invite-link-grant.png
          full_page: true
    - id: qa034-react-memberships-status
      steps:
        - click: button:has-text("Revoke") >> nth=0
        - expect_text: Role grant revoked with safe audit evidence
        - click: button:has-text("Suspend") >> nth=0
        - expect_text: Principal suspend action saved with audit evidence
        - click: button:has-text("Remove membership") >> nth=0
        - expect_text: Tenant membership status saved with audit evidence
        - screenshot: qa034-react-memberships-status.png
          full_page: true
    - id: qa034-react-memberships-history-audit
      steps:
        - expect_text: Access history
        - expect_text: role_scope_denied
        - expect_text: Membership timeline
        - expect_text: audit-membership-qa034-role-revoked
        - screenshot: qa034-react-memberships-history-audit.png
          full_page: true
    - id: qa034-react-memberships-tenant
      steps:
        - goto: /auth/local-login?redirect_to=/admin/app/memberships?tenant_id=11111111-1111-1111-1111-111111111111
        - wait_for_load_state: networkidle
        - click: form:has(input[value="tenant-admin-acme"]) button
        - wait_for_load_state: networkidle
        - expect_text: Membership Administration
        - expect_text: Acme
        - expect_text: Tenant admin
        - screenshot: qa034-react-memberships-tenant.png
          full_page: true
    - id: qa034-react-memberships-tenant-actions
      steps:
        - click: button:has-text("Invite")
        - expect_text: Invitation replayed with original audit evidence
        - click: button:has-text("Grant")
        - expect_text: Role grant saved with backend eligibility evidence
        - expect_text: cross_tenant_denied
        - screenshot: qa034-react-memberships-tenant-actions.png
          full_page: true
