    },
    {
      "id": "frontend-tests",
      "command": "cd frontend/admin && npm run test",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "cd frontend/admin && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "generated-react-contracts",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa031-react-governance-denied",
        "steps": [
          {
            "goto": "/admin/app/governance"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "missing local principal header or cookie"
          },
          {
            "screenshot": "qa031-react-governance-denied.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa031-react-governance-platform",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/governance"
