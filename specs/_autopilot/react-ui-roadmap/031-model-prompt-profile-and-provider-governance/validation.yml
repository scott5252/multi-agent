{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 031 - Model, Prompt, Profile, And Provider Governance",
    "spec_number": "031",
    "spec_slug": "model-prompt-profile-and-provider-governance",
    "feature_dir": "specs/031-model-prompt-profile-and-provider-governance",
    "autopilot_dir": "specs/_autopilot/react-ui-roadmap/031-model-prompt-profile-and-provider-governance",
    "branch": "codex/031-model-prompt-profile-and-provider-governance",
    "qa_id": "qa031",
    "qa_label": "QA031",
    "qa_database": "multi_agent_platform_qa031",
    "qa_env_file": "specs/031-model-prompt-profile-and-provider-governance/.env.qa031",
    "artifact_root": ".data/qa031-artifacts",
    "playwright_output_dir": "output/playwright/qa031_ui",
    "manual_qa_user_guide": "specs/031-model-prompt-profile-and-provider-governance/qa031_user_guide.md"
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f specs/031-model-prompt-profile-and-provider-governance/.env.qa031 && cp specs/031-model-prompt-profile-and-provider-governance/.env.qa031 .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "build-react-admin-assets",
      "command": "cd frontend/admin && npm install && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa031 && createdb -U postgres multi_agent_platform_qa031'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa031 -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p .data/qa031-artifacts output/playwright/qa031_ui",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "react-governance-shell-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "React Admin",
        "/admin/app/bootstrap.json"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-platform-dashboard",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/governance/bootstrap.json'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Governance",
        "OpenAI primary",
        "provider-probe-openai-primary",
        "ModelGateway-only execution is enforced.",
        "fp_qa031_openai"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "/Users/",
        "raw prompt",
        "raw completion",
        "raw provider"
      ]
    },
    {
      "id": "react-governance-tenant-dashboard",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Acme",
        "Daily briefing prompt",
        "gpt-qa031-safe-route",
        "audit-routing-preview-qa031",
        "\"authorized_actions\":[]"
      ],
      "expect_not_contains": [
        "Globex",
        "Local compatible provider",
        "qa031-secret-value",
        "/Users/",
        "raw prompt",
        "raw completion"
      ]
    },
    {
      "id": "react-governance-provider-probe-platform",
      "command": "curl --fail --silent --show-error -X POST -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/governance/providers/openai-primary/probe'",
      "expect_exit_code": 0,
      "expect_contains": [
        "accepted",
        "safe reference selected",
        "audit-governance-probe-qa031-openai-primary",
        "ProviderSecretResolver selected an authorized reference."
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "provider token",
        "raw provider",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-provider-credential-platform",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/governance/providers/openai-primary/credential-reference' -d '{\"credential_reference_id\":\"secret-ref-openai-primary\",\"revision\":\"provider-rev-qa031-current\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "accepted",
        "Credential reference updated",
        "audit-governance-credential-qa031-openai-primary"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "resolved credential",
        "authorization header",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-provider-probe-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa031-tenant-probe-denied.json --write-out '%{http_code}' -X POST -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/providers/openai-primary/probe')\" = \"403\" && ! rg -q 'safe reference selected|audit-governance-probe-qa031-openai-primary|OpenAI primary' /tmp/qa031-tenant-probe-denied.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-governance-prompt-save",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/prompts/daily-briefing/save?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"revision\":\"prompt-rev-qa031-current\",\"idempotency_key\":\"qa031-prompt-save\",\"safe_summary\":\"Review fixture-safe prompt summary.\",\"publish\":false}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "accepted",
        "daily-briefing-rev-qa031-next",
        "audit-prompt-save-qa031-daily-briefing"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "raw prompt",
        "raw completion",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-prompt-preview-unsafe",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/prompts/daily-briefing/preview?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"fixture_id\":\"qa031-unsafe-preview\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "summarized",
        "Preview was summarized",
        "audit-prompt-preview-qa031-qa031-unsafe-preview"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "raw prompt",
        "raw completion",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-profile-save",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/profiles/briefing-runtime/save?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"revision\":\"profile-rev-qa031-current\",\"idempotency_key\":\"qa031-profile-save\",\"model_binding\":\"gpt-qa031-safe-route\",\"provider_binding\":\"openai-primary\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "accepted",
        "Runtime profile draft saved",
        "audit-profile-save-qa031-briefing-runtime"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "raw prompt",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-profile-resolve",
      "command": "curl --fail --silent --show-error -X POST -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/profiles/briefing-runtime/resolve?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "ready",
        "openai-primary through ModelGateway",
        "audit-profile-resolution-qa031-briefing-runtime"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-routing-preview",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/routing/preview?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"profile_id\":\"briefing-runtime\",\"skill_id\":\"weather-readonly\",\"workflow_context\":\"Daily briefing workflow\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "accepted",
        "No live providers were invoked.",
        "ModelGateway-only execution preserved.",
        "audit-routing-preview-qa031"
      ],
      "expect_not_contains": [
        "qa031-secret-value",
        "raw prompt",
        "raw completion",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-history",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/history.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Credential reference metadata was reviewed.",
        "audit-history-routing-qa031"
      ],
      "expect_not_contains": [
        "Globex",
        "qa031-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-provenance",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/provenance/run-qa031-briefing.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Daily briefing workflow",
        "Credential reference fingerprint was ready.",
        "audit-run-provenance-qa031"
      ],
      "expect_not_contains": [
        "Globex",
        "qa031-secret-value",
        "raw prompt",
        "raw completion",
        "/Users/"
      ]
    },
    {
      "id": "react-governance-denied-fails-closed",
      "command": "test \"$(curl --silent --output /tmp/qa031-governance-denied.json --write-out '%{http_code}' http://127.0.0.1:8000/admin/app/governance/bootstrap.json)\" = \"401\" && rg -q 'missing local principal header or cookie' /tmp/qa031-governance-denied.json && ! rg -q 'OpenAI primary|Daily briefing prompt|audit-routing-preview-qa031' /tmp/qa031-governance-denied.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-governance-cross-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa031-governance-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/governance/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222')\" = \"403\" && ! rg -q 'Globex|OpenAI primary|Daily briefing prompt|audit-routing-preview-qa031' /tmp/qa031-governance-cross-tenant.json",
      "expect_exit_code": 0
    }
  ],
  "extra_quality_commands": [
    {
      "id": "qa-documents",
      "command": "bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/031-model-prompt-profile-and-provider-governance",
      "expect_exit_code": 0
    },
    {
      "id": "governance-focused-tests",
