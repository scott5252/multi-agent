{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 029 - Operations, Reliability, And Run Debug Workbench",
    "spec_number": "029",
    "spec_slug": "operations-reliability-and-run-debug-workbench",
    "feature_dir": "specs/029-operations-reliability-and-run-debug-workbench",
    "autopilot_dir": "specs/_autopilot/react-ui-roadmap/029-operations-reliability-and-run-debug-workbench",
    "branch": "codex/029-operations-reliability-and-run-debug-workbench",
    "qa_id": "qa029",
    "qa_label": "QA029",
    "qa_database": "multi_agent_platform_qa029",
    "qa_env_file": "specs/029-operations-reliability-and-run-debug-workbench/.env.qa029",
    "artifact_root": ".data/qa029-artifacts",
    "playwright_output_dir": "output/playwright/qa029_ui",
    "manual_qa_user_guide": "specs/029-operations-reliability-and-run-debug-workbench/qa029_user_guide.md"
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f specs/029-operations-reliability-and-run-debug-workbench/.env.qa029 && cp specs/029-operations-reliability-and-run-debug-workbench/.env.qa029 .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "build-react-admin-assets",
      "command": "cd frontend/admin && npm install && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa029 && createdb -U postgres multi_agent_platform_qa029'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa029 -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p .data/qa029-artifacts output/playwright/qa029_ui",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "react-operations-shell-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/operations'",
      "expect_exit_code": 0,
      "expect_contains": [
        "React Admin",
        "/admin/app/bootstrap.json"
      ],
      "expect_not_contains": [
        "qa029-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-operations-platform-envelope",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/operations.json'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Operations workbench",
        "Provider health",
        "Daily briefing graph run",
        "artifact-ref-qa029-platform",
        "workbench-export"
      ],
      "expect_not_contains": [
        "qa029-secret-value",
        "/Users/",
        "raw provider response",
        "private channel message"
      ]
    },
    {
      "id": "react-operations-auditor-envelope",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: auditor' 'http://127.0.0.1:8000/admin/app/operations.json'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Operations workbench",
        "Provider health"
      ],
      "expect_not_contains": [
        "qa029-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-operations-tenant-envelope",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/operations.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Tenant run health",
        "Tenant delivery",
        "artifact-ref-qa029-tenant"
      ],
      "expect_not_contains": [
        "Provider health",
        "Globex",
        "qa029-secret-value",
        "/Users/"
      ]
    },
    {
      "id": "react-operations-filtered-gateway",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/operations.json?severity=warning&subsystem=gateway'",
      "expect_exit_code": 0,
      "expect_contains": [
        "log-gateway-timeout",
        "Gateway attempt recorded retryable timeout category."
      ],
      "expect_not_contains": [
        "log-delivery-retry",
        "qa029-secret-value"
      ]
    },
    {
      "id": "react-operations-bad-range-safe-problem",
      "command": "test \"$(curl --silent --output /tmp/qa029-bad-range.json --write-out '%{http_code}' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/operations.json?range=24h')\" = \"400\" && rg -q 'validation_error' /tmp/qa029-bad-range.json && ! rg -q '24h|qa029-secret-value|/Users/' /tmp/qa029-bad-range.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-operations-bad-subsystem-safe-problem",
      "command": "test \"$(curl --silent --output /tmp/qa029-bad-subsystem.json --write-out '%{http_code}' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/operations.json?subsystem=provider_payload')\" = \"400\" && rg -q 'validation_error' /tmp/qa029-bad-subsystem.json && ! rg -q 'provider_payload|qa029-secret-value|/Users/' /tmp/qa029-bad-subsystem.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-operations-run-debug-tenant",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/operations/runs/00000000-0000-0000-0000-000000000029.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "Daily briefing graph run",
        "Calendar branch",
        "Weather branch",
        "allowed_read_only",
        "mock_delivery_retry"
      ],
      "expect_not_contains": [
        "Globex",
        "qa029-secret-value",
        "/Users/",
        "private channel message"
      ]
    },
    {
      "id": "react-operations-export-platform",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: platform-admin' 'http://127.0.0.1:8000/admin/app/operations/export' -d '{\"scope_type\":\"active\",\"range\":\"60m\",\"include_run_debug\":true}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "complete",
        "artifact-ref-qa029-platform",
        "audit-workbench-export-qa029-platform"
      ],
      "expect_not_contains": [
        "/Users/",
        "qa029-secret-value",
        "provider payload"
      ]
    },
    {
      "id": "react-operations-export-tenant",
      "command": "curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/operations/export?tenant_id=11111111-1111-1111-1111-111111111111' -d '{\"scope_type\":\"active\",\"range\":\"60m\"}'",
      "expect_exit_code": 0,
      "expect_contains": [
        "complete",
        "artifact-ref-qa029-tenant"
      ],
      "expect_not_contains": [
        "Globex",
        "/Users/",
        "qa029-secret-value"
      ]
    },
    {
      "id": "react-operations-denied-fails-closed",
      "command": "test \"$(curl --silent --output /tmp/qa029-operations-denied.json --write-out '%{http_code}' http://127.0.0.1:8000/admin/app/operations.json)\" = \"401\" && rg -q 'missing local principal header or cookie' /tmp/qa029-operations-denied.json && ! rg -q 'Operations workbench|artifact-ref-qa029' /tmp/qa029-operations-denied.json",
      "expect_exit_code": 0
    },
    {
      "id": "react-operations-cross-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa029-operations-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/operations.json?tenant_id=22222222-2222-2222-2222-222222222222')\" = \"403\" && ! rg -q 'Globex|Operations workbench|artifact-ref-qa029' /tmp/qa029-operations-cross-tenant.json",
      "expect_exit_code": 0
    }
  ],
  "extra_quality_commands": [
    {
      "id": "qa-documents",
      "command": "bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/029-operations-reliability-and-run-debug-workbench",
      "expect_exit_code": 0
    },
    {
      "id": "frontend-typecheck",
      "command": "cd frontend/admin && npm run typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-tests",
      "command": "cd frontend/admin && npm run test",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-build",
      "command": "cd frontend/admin && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "generated-react-contracts",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa029-react-operations-denied",
        "steps": [
          {
            "goto": "/admin/app/operations"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "missing local principal header or cookie"
          },
          {
            "screenshot": "qa029-react-operations-denied.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa029-react-operations-platform",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/operations"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='platform-admin']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "React Admin"
          },
          {
            "expect_text": "Operations workbench"
          },
          {
            "expect_text": "Provider health"
          },
          {
            "expect_text": "Daily briefing graph run"
          },
          {
            "expect_text": "Recovery posture"
          },
          {
            "expect_text": "artifact-ref-qa029-platform"
          },
          {
            "screenshot": "qa029-react-operations-platform.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa029-react-operations-export",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/operations"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='platform-admin']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "button:has-text('Export evidence')"
          },
          {
            "expect_text": "artifact-ref-qa029-platform"
          },
          {
            "expect_text": "provider responses"
          },
          {
            "screenshot": "qa029-react-operations-export.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa029-react-operations-tenant",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app/operations"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='tenant-admin-acme']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "React Admin"
          },
          {
            "expect_text": "Operations workbench"
          },
          {
            "expect_text": "Tenant run health"
          },
          {
            "expect_text": "Tenant delivery"
          },
          {
            "expect_text": "artifact-ref-qa029-tenant"
          },
          {
            "screenshot": "qa029-react-operations-tenant.png",
            "full_page": true
          }
        ]
      }
    ]
  }
}
