{
  "extends": "../../shared/validation.base.yml",
  "variables": {
    "spec_title": "Spec 026 - React Admin UI Foundation",
    "spec_number": "026",
    "spec_slug": "react-admin-ui-foundation",
    "feature_dir": "specs/026-react-admin-ui-foundation",
    "autopilot_dir": "specs/_autopilot/react-ui-roadmap/026-react-admin-ui-foundation",
    "branch": "codex/026-react-admin-ui-foundation",
    "qa_id": "qa026",
    "qa_label": "QA026",
    "qa_database": "multi_agent_platform_qa026",
    "qa_env_file": "specs/026-react-admin-ui-foundation/.env.qa026",
    "artifact_root": ".data/qa026-artifacts",
    "playwright_output_dir": "output/playwright/qa026_ui",
    "manual_qa_user_guide": "specs/026-react-admin-ui-foundation/qa026_user_guide.md"
  },
  "setup_commands": [
    {
      "id": "backup-env",
      "command": "test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup",
      "expect_exit_code": 0
    },
    {
      "id": "copy-qa-env",
      "command": "test -f specs/026-react-admin-ui-foundation/.env.qa026 && cp specs/026-react-admin-ui-foundation/.env.qa026 .env",
      "expect_exit_code": 0
    },
    {
      "id": "install-deps",
      "command": "uv sync",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "build-react-admin-assets",
      "command": "cd frontend/admin && npm install && npm run build",
      "expect_exit_code": 0,
      "timeout_seconds": 300
    },
    {
      "id": "start-postgres",
      "command": "docker compose up -d postgres",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "reset-qa-db",
      "command": "docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa026 && createdb -U postgres multi_agent_platform_qa026'",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "migrate-db",
      "command": "uv run alembic upgrade head",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "seed-local-tenants",
      "command": "docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa026 -v ON_ERROR_STOP=1 -c \"INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING\"",
      "expect_exit_code": 0,
      "timeout_seconds": 120
    },
    {
      "id": "create-artifact-root",
      "command": "mkdir -p .data/qa026-artifacts output/playwright/qa026_ui",
      "expect_exit_code": 0
    }
  ],
  "extra_commands": [
    {
      "id": "react-bootstrap-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111'",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"label\":\"Acme\"",
        "\"react_admin_enabled\":true",
        "\"api_version\":\"qa026\""
      ],
      "expect_not_contains": [
        "qa026-secret-value",
        "raw-jti",
        "/Users/"
      ]
    },
    {
      "id": "react-config-authenticated",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' http://127.0.0.1:8000/admin/app/config.json",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"mount_path\":\"/admin/app\"",
        "\"asset_base_path\":\"/admin/static/react\""
      ]
    },
    {
      "id": "react-manifest-safe-summary",
      "command": "curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' http://127.0.0.1:8000/admin/app/manifest.json",
      "expect_exit_code": 0,
      "expect_contains": [
        "\"base_path\":\"/admin/static/react\"",
        "\"entrypoints\""
      ],
      "expect_not_contains": [
        "/Users/",
        "frontend/admin"
      ]
    },
    {
      "id": "react-denied-fails-closed",
      "command": "test \"$(curl --silent --output /tmp/qa026-denied.html --write-out '%{http_code}' http://127.0.0.1:8000/admin/app)\" = \"401\" && rg -q 'missing local principal header or cookie' /tmp/qa026-denied.html",
      "expect_exit_code": 0
    },
    {
      "id": "react-cross-tenant-denied",
      "command": "test \"$(curl --silent --output /tmp/qa026-cross-tenant.json --write-out '%{http_code}' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/bootstrap.json?tenant_id=22222222-2222-2222-2222-222222222222')\" = \"403\" && ! rg -q 'Globex' /tmp/qa026-cross-tenant.json",
      "expect_exit_code": 0
    }
  ],
  "extra_quality_commands": [
    {
      "id": "qa-documents",
      "command": "bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/026-react-admin-ui-foundation",
      "expect_exit_code": 0
    },
    {
      "id": "frontend-typecheck",
      "command": "cd frontend/admin && npm run typecheck",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "frontend-tests",
      "command": "cd frontend/admin && npm run test",
      "expect_exit_code": 0,
      "timeout_seconds": 180
    },
    {
      "id": "generated-react-contracts",
      "command": "uv run python scripts/frontend/generate_admin_react_types.py --check",
      "expect_exit_code": 0
    }
  ],
  "playwright": {
    "flows": [
      {
        "id": "qa026-react-ui-denied",
        "steps": [
          {
            "goto": "/admin/app"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "missing local principal header or cookie"
          },
          {
            "screenshot": "qa026-react-ui-denied.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa026-react-ui-login",
        "steps": [
          {
            "goto": "/auth/local-login?redirect_to=/admin/app"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "click": "form:has(input[value='tenant-admin-acme']) button"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "React Admin"
          },
          {
            "expect_text": "Existing console"
          },
          {
            "screenshot": "qa026-react-ui-authenticated.png",
            "full_page": true
          }
        ]
      },
      {
        "id": "qa026-react-ui-disabled-route",
        "steps": [
          {
            "goto": "/admin/app/workflows"
          },
          {
            "wait_for_load_state": "networkidle"
          },
          {
            "expect_text": "React route not migrated"
          },
          {
            "expect_text": "Open existing page"
          },
          {
            "screenshot": "qa026-react-ui-disabled-route.png",
            "full_page": true
          }
        ]
      }
    ]
  }
}
