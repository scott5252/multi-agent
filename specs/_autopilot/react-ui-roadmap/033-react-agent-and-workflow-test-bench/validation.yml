extends: ../../shared/validation.base.yml
variables:
  spec_title: Spec 033 - React Agent And Workflow Test Bench
  spec_number: "033"
  spec_slug: react-agent-and-workflow-test-bench
  feature_dir: specs/033-react-agent-and-workflow-test-bench
  autopilot_dir: specs/_autopilot/react-ui-roadmap/033-react-agent-and-workflow-test-bench
  branch: codex/033-react-agent-and-workflow-test-bench
  qa_id: qa033
  qa_label: QA033
  qa_database: multi_agent_platform_qa033
  qa_env_file: specs/033-react-agent-and-workflow-test-bench/.env.qa033
  artifact_root: .data/qa033-artifacts
  playwright_output_dir: output/playwright/qa033_ui
  manual_qa_user_guide: specs/033-react-agent-and-workflow-test-bench/qa033_user_guide.md
setup_commands:
  - id: backup-env
    command: test ! -f .env || test -f .env.autopilot-backup || cp .env .env.autopilot-backup
    expect_exit_code: 0
  - id: copy-qa-env
    command: test -f specs/033-react-agent-and-workflow-test-bench/.env.qa033 && cp specs/033-react-agent-and-workflow-test-bench/.env.qa033 .env
    expect_exit_code: 0
  - id: install-deps
    command: uv sync
    expect_exit_code: 0
    timeout_seconds: 300
  - id: build-react-admin-assets
    command: cd frontend/admin && npm install && npm run build
    expect_exit_code: 0
    timeout_seconds: 300
  - id: start-postgres
    command: docker compose up -d postgres
    expect_exit_code: 0
    timeout_seconds: 120
  - id: reset-qa-db
    command: docker compose exec -T postgres sh -c 'dropdb -U postgres --if-exists multi_agent_platform_qa033 && createdb -U postgres multi_agent_platform_qa033'
    expect_exit_code: 0
    timeout_seconds: 120
  - id: migrate-db
    command: uv run alembic upgrade head
    expect_exit_code: 0
    timeout_seconds: 180
  - id: seed-local-tenants
    command: >-
      docker compose exec -T postgres psql -U postgres -d multi_agent_platform_qa033 -v ON_ERROR_STOP=1 -c "INSERT INTO tenants (tenant_id, slug, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111', 'acme', 'Acme', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('22222222-2222-2222-2222-222222222222', 'globex', 'Globex', 'active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (slug) DO NOTHING"
    expect_exit_code: 0
    timeout_seconds: 120
  - id: create-artifact-root
    command: mkdir -p .data/qa033-artifacts output/playwright/qa033_ui
    expect_exit_code: 0
extra_commands:
  - id: react-test-bench-shell-authenticated
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench?tenant_id=11111111-1111-1111-1111-111111111111'
    expect_exit_code: 0
    expect_contains:
      - React Admin
    expect_not_contains:
      - qa033-secret-value
      - /Users/
  - id: react-test-bench-dashboard
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/bootstrap.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa033-tenant-test-bench.json && rg -q 'Daily briefing release gate' /tmp/qa033-tenant-test-bench.json && rg -q 'mock_model_tools' /tmp/qa033-tenant-test-bench.json && ! rg -q 'qa033-secret-value|raw prompt|raw completion|raw transcript|/Users/|Globex' /tmp/qa033-tenant-test-bench.json
    expect_exit_code: 0
  - id: react-test-bench-suite-list
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/suites?tenant_id=11111111-1111-1111-1111-111111111111'
    expect_exit_code: 0
    expect_contains:
      - suite-qa033-daily-briefing
      - Daily briefing release gate
      - workflow-draft-rev-qa033-current
    expect_not_contains:
      - qa033-secret-value
      - /Users/
      - Globex
  - id: react-test-bench-suite-save
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/suites?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"name":"Daily briefing release gate","description":"Safe suite summary for release governance.","target_type":"workflow_draft","target_id":"workflow-daily-briefing","target_revision":"workflow-draft-rev-qa033-current","default_safe_mode":"mock_model_tools","pass_threshold":0.9,"required_for_publish":true,"revision":"suite-rev-qa033-current","idempotency_key":"qa033-suite-save"}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Test suite saved with current target revision binding
      - audit-test-suite-save-qa033
    expect_not_contains:
      - qa033-secret-value
      - raw prompt
      - /Users/
  - id: react-test-bench-case-save
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/suites/suite-qa033-daily-briefing/cases?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"name":"Briefing summary contract","fixture_summary":"Safe fixture summary only.","expected_contract_summary":"Summary and recommendation status are required.","assertions":[{"assertion_id":"assertion-qa033-contract","label":"Contract shape","kind":"contract_shape","path_summary":"response.summary.status","comparator":"equals","expected_summary":"Ready state summary","severity":"blocking","threshold_weight":0.5,"validation_status":"ready"}],"evaluator_reference_id":"evaluator-qa033-safe-summary","revision":"case-rev-qa033-current","idempotency_key":"qa033-case-save"}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Test case saved with structured assertion descriptors
      - audit-test-case-save-qa033
    expect_not_contains:
      - qa033-secret-value
      - raw prompt
      - raw completion
      - /Users/
  - id: react-test-bench-run-launch-mock
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/suites/suite-qa033-daily-briefing/runs?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"target_revision":"workflow-draft-rev-qa033-current","safe_mode":"mock_model_tools","run_reason":"Release confidence","idempotency_key":"qa033-run-launch"}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Test run queued with backend-owned progress evidence
      - audit-test-run-launch-qa033
    expect_not_contains:
      - qa033-secret-value
      - authorization header
      - provider token
      - /Users/
  - id: react-test-bench-live-probe-denied
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/suites/suite-qa033-daily-briefing/runs?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"target_revision":"workflow-draft-rev-qa033-current","safe_mode":"real_dependency_probe","run_reason":"Release confidence","idempotency_key":"qa033-live-probe-denied"}'
    expect_exit_code: 0
    expect_contains:
      - validation_error
      - Real dependency probes require policy approval
      - audit-test-run-probe-denied-qa033
    expect_not_contains:
      - qa033-secret-value
      - authorization header
      - provider token
      - /Users/
  - id: react-test-bench-run-detail
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/runs/run-qa033-failing.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa033-run-detail.json && rg -q 'Blocked side-effect assertion failed' /tmp/qa033-run-detail.json && rg -q 'artifact-qa033-summary' /tmp/qa033-run-detail.json && ! rg -q 'qa033-secret-value|raw prompt|raw completion|raw transcript|stack trace|/Users/|Globex' /tmp/qa033-run-detail.json
    expect_exit_code: 0
  - id: react-test-bench-gates
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/gates.json?tenant_id=11111111-1111-1111-1111-111111111111' > /tmp/qa033-gates.json && rg -q 'suite-qa033-daily-briefing' /tmp/qa033-gates.json && rg -q 'stale' /tmp/qa033-gates.json && ! rg -q 'qa033-secret-value|/Users/|Globex' /tmp/qa033-gates.json
    expect_exit_code: 0
  - id: react-test-bench-gate-refresh
    command: >-
      curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/gates/qa033-required-suite/refresh?tenant_id=11111111-1111-1111-1111-111111111111' -d '{"target_revision":"workflow-draft-rev-qa033-current","idempotency_key":"qa033-gate-refresh"}'
    expect_exit_code: 0
    expect_contains:
      - accepted
      - Publish-gate evidence is current for the selected target revision
      - audit-gate-qa033-passed
    expect_not_contains:
      - qa033-secret-value
      - /Users/
  - id: react-test-bench-artifact
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/artifacts/artifact-qa033-summary.json?tenant_id=11111111-1111-1111-1111-111111111111'
    expect_exit_code: 0
    expect_contains:
      - artifact-qa033-summary
      - sha256:qa033artifactsummary
      - safe-summary
    expect_not_contains:
      - qa033-secret-value
      - storage path
      - /Users/
  - id: react-test-bench-audit
    command: >-
      curl --fail --silent --show-error -H 'X-Local-Principal: tenant-admin-acme' 'http://127.0.0.1:8000/admin/app/test-bench/audit.json?tenant_id=11111111-1111-1111-1111-111111111111'
    expect_exit_code: 0
    expect_contains:
      - audit-test-suite-save-qa033
      - denied_cross_tenant_access
      - safe-denial
    expect_not_contains:
      - qa033-secret-value
      - /Users/
      - Globex
extra_quality_commands:
  - id: qa-docs
    command: bash .specify/extensions/qa-docs/scripts/bash/validate-qa-documents.sh specs/033-react-agent-and-workflow-test-bench
    expect_exit_code: 0
  - id: frontend-typecheck-test-build
    command: cd frontend/admin && npm run typecheck && npm run test && npm run build
    expect_exit_code: 0
    timeout_seconds: 300
  - id: generated-react-types-check
    command: uv run python scripts/frontend/generate_admin_react_types.py --check
    expect_exit_code: 0
  - id: focused-test-bench-pytest
    command: uv run pytest --no-cov tests/unit/api/test_admin_test_bench_schema.py tests/unit/admin/test_test_bench_react_service.py tests/performance/test_bench/test_react_test_bench_queries.py tests/contract/test_admin_react_contract.py tests/integration/test_admin_react_routes.py
    expect_exit_code: 0
    timeout_seconds: 300
playwright:
  base_url: http://127.0.0.1:8000
  output_dir: output/playwright/qa033_ui
  flows:
    - id: qa033-react-test-bench-denied
      steps:
        - goto: /admin/app/test-bench
        - wait_for_load_state: networkidle
        - screenshot: qa033-react-test-bench-denied.png
          full_page: true
    - id: qa033-react-test-bench-tenant
      steps:
        - goto: /auth/local-login?redirect_to=/admin/app/test-bench
        - wait_for_load_state: networkidle
        - click: form:has(input[value="tenant-admin-acme"]) button
        - wait_for_load_state: networkidle
        - expect_text: Test Bench
        - expect_text: Daily briefing release gate
        - screenshot: qa033-react-test-bench-tenant.png
          full_page: true
    - id: qa033-react-test-bench-authoring
      steps:
        - click: text=Save suite
        - expect_text: audit-test-suite-save-qa033
        - click: text=Save case
        - expect_text: audit-test-case-save-qa033
        - screenshot: qa033-react-test-bench-authoring.png
          full_page: true
    - id: qa033-react-test-bench-result
      steps:
        - expect_text: Blocked side-effect assertion failed
        - expect_text: Redacted run summary artifact
        - screenshot: qa033-react-test-bench-result.png
          full_page: true
    - id: qa033-react-test-bench-run
      steps:
        - click: text=Launch run
        - expect_text: audit-test-run-launch-qa033
        - expect_text: Test run queued with backend-owned progress evidence
        - screenshot: qa033-react-test-bench-run.png
          full_page: true
    - id: qa033-react-test-bench-gates
      steps:
        - click: button:has-text("Refresh evidence") >> nth=0
        - expect_text: Publish-gate evidence is current for the selected target revision
        - screenshot: qa033-react-test-bench-gates.png
          full_page: true
    - id: qa033-react-test-bench-audit
      steps:
        - expect_text: Audit timeline
        - expect_text: denied_cross_tenant_access
        - screenshot: qa033-react-test-bench-audit.png
          full_page: true
